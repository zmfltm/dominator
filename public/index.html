<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Dominator</title>
<link rel="icon" type="image/png" href="/logo.png?v=sibyl2">
<link rel="preload" href="/fonts/IoskeleyMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Ioskeley Mono';
    src: url('/fonts/IoskeleyMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --bg: #0b0b0c;
    --fg: #ededef;
    --fg-quiet: rgb(255 255 255 / 0.82);
    --muted: rgb(255 255 255 / 0.62);
    --faint: rgb(255 255 255 / 0.36);
    --border: rgb(255 255 255 / 0.10);
    --border-strong: rgb(255 255 255 / 0.18);
    --surface: rgb(255 255 255 / 0.03);
    --surface-hover: rgb(255 255 255 / 0.06);
    --surface-active: rgb(255 255 255 / 0.10);
    --accent: oklch(0.76 0.14 235);
    --accent-hover: oklch(0.81 0.12 235);
    --accent-fg: #0b0b0c;
    --ring: color-mix(in oklch, var(--accent) 40%, transparent);
    --focus: color-mix(in oklch, var(--accent) 75%, transparent);
    --error: #ff8f8f;
    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono: 'Ioskeley Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    background:
      radial-gradient(ellipse 560px 280px at 50% calc(20svh + 100px), rgb(255 255 255 / 0.035), transparent 70%) no-repeat,
      var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
    caret-color: var(--accent);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  ::selection { background: color-mix(in oklch, var(--accent) 35%, transparent); }
  [hidden] { display: none !important; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .num {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.92em;
  }
  main {
    width: 100%;
    max-width: 672px;
    margin: 0 auto;
    padding: 20svh 16px 96px;
  }
  .brand {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .logo { display: block; width: 48px; height: 48px; }

  button {
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: color 120ms ease, background-color 120ms ease, border-color 120ms ease;
  }
  button:disabled { cursor: default; }
  button:focus-visible,
  input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .control-icon { display: block; width: 18px; height: 18px; flex: 0 0 auto; pointer-events: none; }
  button:has(.control-icon) { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

  .composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; }
  .field {
    flex: 1;
    min-width: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 6px 0 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .field:focus-within {
    border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
    box-shadow: 0 0 0 2px var(--ring);
  }
  #url {
    flex: 1;
    min-width: 0;
    height: 100%;
    background: none;
    border: 0;
    outline: none;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
  }
  #url::placeholder { color: var(--muted); opacity: 1; }
  .source-badge {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: 8px;
    padding: 3px 8px 3px 6px;
    border-radius: 6px;
    background: var(--surface-hover);
    color: var(--fg-quiet);
    font-size: 13px;
    white-space: nowrap;
  }
  .source-badge svg { display: block; width: 16px; height: 16px; }
  .ghost {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    color: var(--muted);
  }
  #clipInput {
    flex: 0 0 auto;
    height: 32px;
    margin: 0 4px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  #clipInput.active,
  #clipInput[aria-expanded='true'] { color: var(--fg); border-color: var(--border-strong); background: var(--surface-hover); }
  #download {
    width: 136px;
    height: 56px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--muted);
    font-size: 15px;
    font-weight: 600;
  }
  #download.ready { border-color: transparent; background: var(--accent); color: var(--accent-fg); }
  #download:not(:disabled):active { background: var(--accent-hover); }

  .input-preview {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding-inline: 4px;
  }
  .input-preview-thumb {
    flex: 0 0 auto;
    width: 48px;
    aspect-ratio: 16 / 9;
    border-radius: 4px;
    background: var(--surface-hover);
    object-fit: cover;
  }
  .input-preview-title {
    min-width: 0;
    overflow: hidden;
    color: var(--fg-quiet);
    font-size: 14px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .reveal {
    display: grid;
    grid-template-rows: 0fr;
    visibility: hidden;
    transition: grid-template-rows 180ms var(--ease-out), visibility 0s linear 180ms;
  }
  .reveal.open {
    grid-template-rows: 1fr;
    visibility: visible;
    transition: grid-template-rows 180ms var(--ease-out), visibility 0s;
  }
  .reveal-inner { min-height: 0; overflow: hidden; }
  .input-clip-panel {
    margin-top: 10px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }

  .clip-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .clip-field { display: flex; align-items: center; }
  .clip-field > span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .clip-field input {
    width: 7rem;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .clip-field input:focus-visible { border-color: color-mix(in oklch, var(--accent) 50%, var(--border)); outline-color: var(--ring); outline-offset: 0; }
  .clip-field input:disabled { color: var(--muted); }
  .clear-clip,
  .preview-clip {
    min-width: 36px;
    height: 36px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg-quiet);
  }
  .clear-clip:disabled,
  .preview-clip:disabled { color: var(--faint); }
  #inputClipTrack,
  #inputClipPreviewPanel,
  .clip-preview-panel,
  .clip-track-wrap {
    flex: 1 0 100%;
    display: grid;
    gap: 6px;
  }
  #inputClipTrack:empty,
  #inputClipPreviewPanel:empty { display: none; }
  .clip-track {
    position: relative;
    height: 88px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    touch-action: none;
    background: repeating-linear-gradient(90deg, rgb(255 255 255 / 0.03) 0 0.55rem, rgb(255 255 255 / 0.06) 0.55rem 1.1rem);
  }
  .clip-track.has-thumb {
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.45)),
      var(--clip-thumb);
    background-position: center, center;
    background-repeat: no-repeat, repeat-x;
    background-size: 100% 100%, auto 100%;
  }
  .clip-track.has-frames { background: #000; }
  .clip-track.has-frames::before { display: none; }
  .clip-frames { position: absolute; inset: 0; pointer-events: none; }
  .clip-frame {
    position: absolute;
    top: 0;
    bottom: 0;
    background-repeat: no-repeat;
    border-right: 1px solid rgba(0, 0, 0, 0.6);
  }
  .clip-cursor {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--fg);
    pointer-events: none;
  }
  .frame-tip {
    position: fixed;
    z-index: 50;
    width: 240px;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: #000;
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
    pointer-events: none;
  }
  .frame-tip-image {
    position: relative;
    background-repeat: no-repeat;
    background-color: var(--surface);
  }
  .frame-tip-image canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .frame-tip-time {
    padding: 3px 6px;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .clip-track::before {
    content: '';
    position: absolute;
    inset: 0.35rem 0;
    background: repeating-linear-gradient(90deg, transparent 0 2.2rem, rgb(255 255 255 / 0.10) 2.2rem 2.25rem);
    pointer-events: none;
  }
  .clip-outside {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.62);
    pointer-events: none;
  }
  .clip-range-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    background: color-mix(in oklch, var(--accent) 12%, transparent);
    border-block: 2px solid var(--accent);
  }
  .clip-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 10px;
    transform: translateX(-50%);
    border-radius: 3px;
    background: var(--accent);
    cursor: ew-resize;
    padding: 0;
  }
  .clip-handle::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 16px;
    border-radius: 1px;
    background: rgb(0 0 0 / 0.45);
    transform: translate(-50%, -50%);
  }
  .clip-track-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .clip-track-zoom { display: flex; gap: 4px; }
  .clip-zoom { min-width: 36px; }
  .clip-track-note,
  .clip-preview-note {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
  }
  .clip-preview-player {
    flex: 1 0 100%;
    width: 100%;
    max-height: 260px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #050505;
  }

  .status { margin-top: 10px; padding-inline: 4px; color: var(--muted); font-size: 13px; }
  .status:empty { display: none; }
  .status.error { color: var(--error); }

  .queue { margin-top: 28px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; }
  .list-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    min-height: 36px;
    margin-bottom: 6px;
  }
  .clear-confirm { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 4px; }
  .confirm-text { margin-right: 6px; color: var(--fg-quiet); font-size: 13px; }
  .text-button {
    position: relative;
    height: 32px;
    padding: 0 10px;
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .text-button.danger { color: var(--error); }
  .text-button::after,
  .text-action::after { content: ''; position: absolute; inset: -6px -2px; }

  .jobs { display: flex; flex-direction: column; gap: 6px; }
  .jobs:empty { display: none; }
  .job {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas:
      'thumb title controls'
      'thumb sub controls';
    column-gap: 12px;
    row-gap: 3px;
    min-height: 64px;
    padding: 9px 6px 9px 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .job.complete { background: transparent; }
  .job-thumb {
    grid-area: thumb;
    align-self: center;
    width: 76px;
    aspect-ratio: 16 / 9;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 6px;
    background: var(--surface-hover);
    color: var(--muted);
  }
  .job-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .job-thumb svg { display: block; width: 20px; height: 20px; }
  .job-url {
    grid-area: title;
    align-self: end;
    min-width: 0;
    overflow: hidden;
    color: var(--fg);
    font-size: 15px;
    font-weight: 500;
    line-height: 1.35;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .job.complete .job-url { color: var(--fg-quiet); font-weight: 400; }
  .job-sub { grid-area: sub; align-self: start; min-width: 0; }
  .job-meta,
  .job-state {
    overflow: hidden;
    color: var(--muted);
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .job-state.error { color: var(--error); white-space: normal; }
  .job-progress { display: grid; gap: 5px; padding-top: 3px; }
  .job-progress .job-state { display: flex; flex-wrap: wrap; column-gap: 8px; }
  .job-progress .job-state .num { margin-left: auto; color: var(--fg-quiet); }
  .bar { height: 3px; overflow: hidden; border-radius: 2px; background: var(--surface-active); }
  .bar div {
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 300ms var(--ease-out);
  }
  .row-controls {
    grid-area: controls;
    align-self: center;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .row-controls button {
    min-width: 44px;
    height: 44px;
    border-radius: 8px;
    color: var(--muted);
  }
  .row-controls .text-action {
    position: relative;
    height: 32px;
    margin-inline: 4px;
    padding: 0 12px 0 10px;
    border: 1px solid var(--border);
    color: var(--fg);
    font-size: 13px;
  }
  .row-controls .text-action .control-icon { width: 16px; height: 16px; }
  .row-controls button:disabled { color: var(--faint); }
  .clip-toggle.active,
  .clip-toggle[aria-expanded='true'] { color: var(--fg); }
  .done-mark { display: inline-flex; padding-inline: 4px; color: var(--muted); }
  .job > .clip-panel { grid-column: 1 / -1; margin: 10px 4px 4px 0; }

  @keyframes row-in { from { opacity: 0; transform: translateY(4px); } }
  @keyframes row-fade { from { opacity: 0; } }
  .job.entering { animation: row-in 200ms var(--ease-out) both; }

  @media (hover: hover) and (pointer: fine) {
    .ghost:not(:disabled):hover,
    .text-button:not(:disabled):hover,
    .clear-clip:not(:disabled):hover,
    .preview-clip:not(:disabled):hover,
    .row-controls button:not(:disabled):hover,
    #clipInput:not(:disabled):hover { color: var(--fg); background: var(--surface-hover); }
    .text-button.danger:hover { color: var(--error); }
    #download.ready:hover { background: var(--accent-hover); }
    .row-controls .reveal-on-hover { opacity: 0; transition: opacity 120ms ease, color 120ms ease, background-color 120ms ease; }
    .job:hover .reveal-on-hover,
    .job:focus-within .reveal-on-hover,
    .job.clip-open .reveal-on-hover { opacity: 1; }
  }
  @media (pointer: coarse) {
    .ghost { width: 44px; height: 44px; }
    .clear-clip, .preview-clip, .clip-zoom { min-width: 44px; height: 44px; }
    .clip-field input { height: 44px; }
    .clip-handle { width: 20px; }
  }
  @media (max-width: 520px) {
    .source-name { display: none; }
    .source-badge { padding: 4px; margin-right: 6px; }
    .field { padding-left: 12px; }
    .job {
      grid-template-areas:
        'thumb title title'
        'thumb sub controls';
      padding-right: 2px;
      row-gap: 0;
    }
    .job.has-action {
      grid-template-areas:
        'thumb title title'
        'thumb sub sub'
        'thumb controls controls';
    }
    .job-thumb { width: 64px; }
    .job-sub { align-self: center; }
    .row-controls { margin-top: -6px; margin-bottom: -8px; }
    .job.has-action .row-controls { justify-self: start; margin: 2px 0 -6px -4px; }
    .job-url { padding-right: 8px; }
    .job-progress .job-state, .job-progress .job-state .num { margin-left: 0; white-space: normal; }
    .row-controls button { min-width: 40px; }
    .clip-field { flex: 1; }
    .clip-field input { width: 100%; min-width: 0; font-size: 16px; }
    .input-clip-panel { padding: 12px; }
  }
  @media (max-width: 399px) {
    .composer { grid-template-columns: minmax(0, 1fr); }
    .input-preview { order: 1; margin-bottom: 2px; }
    #download { order: 2; width: 100%; height: 52px; margin-top: 8px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
    .job.entering { animation-name: row-fade; }
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="logo" src="/logo-hd.png?v=sibyl2" width="768" height="768" alt="">
  </header>
  <div class="input-wrap">
    <form id="form" class="composer">
      <div class="field">
        <label for="url" class="visually-hidden">Video link</label>
        <span id="inputSource" class="source-badge" hidden></span>
        <input id="url" type="text" placeholder="Paste a video link" autofocus spellcheck="false" autocomplete="off">
        <button id="clearText" class="ghost" type="button" title="Clear text" aria-label="Clear text" hidden disabled data-icon="close"></button>
        <button id="add" class="ghost" type="button" title="Add to queue" aria-label="Add to queue" hidden disabled data-icon="add"></button>
        <button id="compress" class="ghost" type="button" title="Compress a file" aria-label="Compress a file" data-icon="compress"></button>
        <button id="clipInput" type="button" title="Set a clip" hidden disabled aria-expanded="false" aria-controls="inputClipPanel">Clip</button>
      </div>
      <button id="download" type="submit" disabled data-icon="download"><span class="button-label">Download</span></button>
      <div id="inputPreview" class="input-preview" hidden>
        <img id="inputPreviewThumb" class="input-preview-thumb" alt="">
        <p id="inputPreviewTitle" class="input-preview-title"></p>
      </div>
    </form>
    <input id="compressFile" type="file" accept="video/*,audio/*" multiple hidden tabindex="-1" aria-hidden="true">
    <div id="inputClipReveal" class="reveal">
      <div class="reveal-inner">
        <div id="inputClipPanel" class="clip-panel input-clip-panel">
          <label class="clip-field">
            <span>start</span>
            <input id="inputClipStart" name="input-clip-start" type="text" aria-label="Clip start time" placeholder="Start">
          </label>
          <label class="clip-field">
            <span>end</span>
            <input id="inputClipEnd" name="input-clip-end" type="text" aria-label="Clip end time" placeholder="End">
          </label>
          <button id="inputClipClear" class="clear-clip" type="button" disabled title="Reset clip" aria-label="Reset clip" data-icon="reset"></button>
          <button id="inputClipPreview" class="preview-clip" type="button" disabled title="Preview clip" aria-label="Preview clip" data-icon="play"></button>
          <button id="inputClipDownload" class="preview-clip" type="button" disabled title="Download clip" aria-label="Download clip" data-icon="download"></button>
          <div id="inputClipTrack"></div>
          <div id="inputClipPreviewPanel"></div>
        </div>
      </div>
    </div>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div class="queue">
    <div id="listHeader" class="list-header" hidden>
      <button id="cancel" class="text-button" type="button" hidden>Cancel all</button>
      <button id="clear" class="text-button" type="button" hidden>Clear history</button>
      <div id="clearConfirm" class="clear-confirm" hidden>
        <span id="clearConfirmText" class="confirm-text"></span>
        <button id="clearConfirmYes" class="text-button danger" type="button" aria-describedby="clearConfirmText">Confirm</button>
        <button id="clearKeep" class="text-button" type="button">Keep</button>
      </div>
    </div>
    <div id="jobs" class="jobs"></div>
    <p id="empty" class="empty">Downloads show up here.</p>
  </div>
</main>
<script>
  const MAX_ACTIVE_JOBS = 7;
  const MAX_CLIP_SECONDS = 24 * 60 * 60;
  const LINKED_CLIP_SECONDS = 30;
  const DOUBLE_BACKSPACE_MS = 300;
  const ROW_ENTER_MS = 200;
  const ROW_STAGGER_MS = 40;
  const ROW_STAGGER_MAX_STEPS = 2;
  const form = document.getElementById('form');
  const urlInput = document.getElementById('url');
  const inputSource = document.getElementById('inputSource');
  const inputPreview = document.getElementById('inputPreview');
  const inputPreviewThumb = document.getElementById('inputPreviewThumb');
  const inputPreviewTitle = document.getElementById('inputPreviewTitle');
  const inputClipReveal = document.getElementById('inputClipReveal');
  const addButton = document.getElementById('add');
  const clipInputButton = document.getElementById('clipInput');
  const inputClipPanel = document.getElementById('inputClipPanel');
  const inputClipStart = document.getElementById('inputClipStart');

  function parseClipTime(value) {
    const text = value.trim();
    if (!text) return null;

    const parts = text.split(':');
    if (parts.length > 3) return NaN;

    let total = 0;
    for (let index = 0; index < parts.length; index += 1) {
      const part = parts[index];
      const isLast = index === parts.length - 1;
      const pattern = isLast ? /^\d+(?:\.\d{1,3})?$/ : /^\d+$/;
      if (!pattern.test(part)) return NaN;

      const amount = Number(part);
      if (!Number.isFinite(amount)) return NaN;
      if (isLast && parts.length > 1 && amount >= 60) return NaN;
      if (!isLast && index > 0 && amount >= 60) return NaN;
      total = total * 60 + amount;
    }

    return total;
  }

  function parseLinkedTime(value) {
    if (!value) return NaN;
    const text = value.trim().replace(/^#?t=/, '');
    if (text.includes(':')) return parseClipTime(text);

    if (!hms || !hms[0]) return NaN;
    const hours = Number(hms[1] || 0);
    const minutes = Number(hms[2] || 0);
    const seconds = Number(hms[3] || 0);
    const total = hours * 3600 + minutes * 60 + seconds;
    return Number.isFinite(total) ? total : NaN;
  }

  function formatClipTime(seconds) {
    if (!Number.isFinite(seconds)) return '';
    const rounded = Math.max(0, Math.round(seconds * 1000) / 1000);
    let wholeSeconds = Math.floor(rounded);
    let milliseconds = Math.round((rounded - wholeSeconds) * 1000);
    if (milliseconds === 1000) {
      wholeSeconds += 1;
      milliseconds = 0;
    }

    const hours = Math.floor(wholeSeconds / 3600);
    const minutes = Math.floor((wholeSeconds % 3600) / 60);
    const secs = wholeSeconds % 60;
    const secondText = String(secs).padStart(2, '0') +
      (milliseconds ? '.' + String(milliseconds).padStart(3, '0').replace(/0+$/, '') : '');
    if (hours > 0) return hours + ':' + String(minutes).padStart(2, '0') + ':' + secondText;
    return minutes + ':' + secondText;

      }
      if (!Number.isFinite(end)) {
        end = parseLinkedTime(mediaFragment?.[2] || queryFragment.get('end'));
      }
    }

    if (!Number.isFinite(start) && !Number.isFinite(end)) return null;
    if (Number.isFinite(start) && !Number.isFinite(end)) end = start + LINKED_CLIP_SECONDS;
    return {
      start: Number.isFinite(start) ? start : null,
      end: Number.isFinite(end) ? end : null,

  }

  function completeClipText(startText, endText, duration) {

    const start = parseClipTime(completed.start);
    const end = parseClipTime(completed.end);
    if (
      Number.isFinite(start) &&
      Number.isFinite(end) &&
      typeof duration === 'number' &&
      Number.isFinite(duration) &&
      duration > start &&
      end > duration
    ) {
      completed.end = formatClipTime(duration);
    }
    if (
      completed.start &&
      !completed.end &&
      typeof duration === 'number' &&
      Number.isFinite(duration) &&
      Number.isFinite(start) &&
      duration > start

  function clipPayload(item) {

    if (matchesHost(host, 'twitter.com') || matchesHost(host, 'x.com')) return 'x';

  function formatBytes(bytes) {

    while (value >= 1024 && unit < units.length - 1) {
      value /= 1024;
      unit += 1;
    }
    const digits = value >= 10 || unit === 0 ? 0 : 1;
    return value.toFixed(digits) + ' ' + units[unit];

  function progressLabel(item) {

    if (item.status === 'processing') return clip ? 'Cutting clip' : 'Processing';
    if (item.status === 'saving') return clip ? 'Saving clip' : 'Saving';
    if (item.status === 'uploading') return 'Uploading';
    if (item.status === 'compressing') return 'Compressing';
