      const speed = formatBytes(item.bytesPerSecond);
      const rate = speed ? ' · ' + speed + '/s' : '';
      const left = Number.isFinite(item.etaSeconds) && item.percent < 100
        ? ' · ' + formatClipTime(item.etaSeconds) + ' left'
        : '';
      return item.percent.toFixed(1) + '%' + size + rate + left;
    }
    if (item.status === 'uploading' || item.status === 'compressing') return Math.floor(item.percent) + '%';
    return '';
  }

  function paintProgress(state, item) {
    const [label, numbers] = state.children;
    label.textContent = progressLabel(item);
    numbers.textContent = progressNumbers(item);
  }

  function rowClip(item) {
    if (item.activeClip) return item.activeClip;
    if (!canEditClip(item) || !hasClipText(item)) return null;
    const clip = clipPayload(item);
    return clip.ok ? clip.clip : null;
  }

  // Meta line, for example "YouTube · Clip 26:03-26:33 · 0:30 · 12 MB".
  function paintMeta(meta, item) {
    const parts = [item.kind === 'compress' ? sourceName('file') : sourceLabel(item.url) || sourceName('generic')];
    const clip = rowClip(item);
    if (clip) parts.push(['Clip ', formatClipTime(clip.start) + '-' + formatClipTime(clip.end)]);
    const length = clip ? clip.end - clip.start : item.duration;
    if (typeof length === 'number' && Number.isFinite(length) && length > 0) parts.push(['', formatClipTime(length)]);
    const size = formatBytes(item.totalBytes);
    if (size) parts.push(['', size]);
    if (item.status === 'canceled') parts.push('Canceled');

    const nodes = [];
    parts.forEach((part, index) => {
      if (index > 0) nodes.push(' · ');
      if (typeof part === 'string') {
        nodes.push(part);
        return;
      }
      const number = document.createElement('span');
      number.className = 'num';
      number.textContent = part[1];
      nodes.push(part[0], number);
    });
    meta.replaceChildren(...nodes);
  }

  // Clip edits skip full renders to keep typing and dragging smooth.
  function refreshMeta(item) {
    const meta = rowElements.get(item.localId)?.querySelector('.job-meta');
    if (meta) paintMeta(meta, item);
  }

  function displayTitle(item) {
    if (item.title) return item.title;
    if (item.titleLoading) return 'Loading title';
    return item.url;
  }

  function singleDownloadTitle(active) {
    if (groupRunning) return 'Group download active';
    if (active >= MAX_ACTIVE_JOBS) return 'Max active downloads';
    return 'Download this';
  }

  function downloadOneLabel(item) {
    if (item.kind === 'compress') return 'Compress this file';
    return item.format !== 'mp4' ? 'Download this track' : 'Download this video';
  }

  function canStartSingleDownload(item, active) {
    return (
      !groupRunning &&
      active < MAX_ACTIVE_JOBS &&
      (item.status === 'queued' || isRetryable(item))
    );
  }

  function canPreviewClipNow(item) {
    return canEditClip(item) && hasClipText(item) && (clipPayload(item).ok || item.status === 'invalid');
  }

  function canDownloadClipNow(item) {
    return (
      canEditClip(item) &&
      hasClipText(item) &&
      clipPayload(item).ok &&
      !groupRunning &&
      activeCount() < MAX_ACTIVE_JOBS
    );
  }

  function endClipDrag() {
    if (!clipDragActive) return;
    clipDragActive = false;
    if (renderQueued) render();
  }

  function clipTrackValues(startText, endText, duration) {
    const parsedStart = parseClipTime(startText);
    const parsedEnd = parseClipTime(endText);
    const knownDuration = typeof duration === 'number' && Number.isFinite(duration) && duration > 0
      ? duration
      : null;
    const trackDuration = knownDuration ?? Math.max(
      Number.isFinite(parsedStart) ? parsedStart : 0,
      Number.isFinite(parsedEnd) ? parsedEnd : 0,
      60,
    );
    const start = Number.isFinite(parsedStart) ? clamp(parsedStart, 0, trackDuration) : 0;
    const end = Number.isFinite(parsedEnd) ? clamp(parsedEnd, 0, trackDuration) : trackDuration;
    return {
      duration: trackDuration,
      start: Math.min(start, end),
      end: Math.max(start, end),
      isKnownDuration: knownDuration !== null,
    };
  }

  const CLIP_ZOOMS = [1, 2, 4, 8, 16, 32, 64, 128, 256];
  const MIN_VIEW_SECONDS = 2;

  function newClipView() {
    // zoom null fits the selection automatically. anchor pins the view start
    // after a drag so releasing a handle does not move the timeline.
    return { zoom: null, focus: null, anchor: null };
  }

  function resetClipView(viewState) {
    viewState.zoom = null;
    viewState.focus = null;
    viewState.anchor = null;
  }

  function fitClipZoom(values) {
    const selected = values.end - values.start;
    if (!values.isKnownDuration || selected >= values.duration * 0.98) return 1;
    let zoom = 1;
    for (const level of CLIP_ZOOMS) {
      if (values.duration / level >= Math.max(selected * 3, MIN_VIEW_SECONDS)) zoom = level;
    }
    return zoom;
  }

  function resolvedClipZoom(values, zoom) {
    return CLIP_ZOOMS.includes(zoom) ? zoom : fitClipZoom(values);
  }

  function stepClipZoom(values, current, direction) {
    const index = CLIP_ZOOMS.indexOf(resolvedClipZoom(values, current));
    return CLIP_ZOOMS[clamp(index + direction, 0, CLIP_ZOOMS.length - 1)];
  }

  function clipTrackView(values, viewState) {
    const zoom = resolvedClipZoom(values, viewState.zoom);
    const viewDuration = Math.min(values.duration, Math.max(values.duration / zoom, MIN_VIEW_SECONDS));
    if (viewState.anchor !== null) return viewAt(values, viewState.anchor, viewDuration, zoom);
    const selected = values.end - values.start;
    // Zoomed in tighter than the selection: follow the handle being adjusted.
    let center = values.start + selected / 2;
    if (viewDuration < selected * 1.15) {
      center = viewState.focus === 'end' ? values.end : values.start;
    }
    return viewAt(values, center - viewDuration / 2, viewDuration, zoom);
  }

  function viewAt(values, start, viewDuration, zoom) {
    const clampedStart = clamp(start, 0, Math.max(0, values.duration - viewDuration));
    return {
      start: clampedStart,
      end: Math.min(values.duration, clampedStart + viewDuration),
      duration: Math.max(viewDuration, 0.1),
      zoom,
    };
  }

  function percentInView(seconds, view) {
    return clamp((seconds - view.start) / view.duration * 100, 0, 100);
  }

  function sanitizeStoryboard(value) {
    if (!value || typeof value !== 'object') return null;
    const { width, height, columns, rows, interval, sheets } = value;
    const sizes = [width, height, columns, rows].every((n) => Number.isInteger(n) && n > 0 && n <= 4096);
    if (!sizes || typeof interval !== 'number' || !(interval > 0) || !Array.isArray(sheets) || !sheets.length) {
      return null;
    }
    const urls = sheets.map(safeThumbnailUrl);
    if (urls.some((url) => !url)) return null;
    return { width, height, columns, rows, interval, sheets: urls };
  }

  function sanitizeStoryboards(list) {
    return Array.isArray(list) ? list.map(sanitizeStoryboard).filter(Boolean) : [];
  }

  function combinedStoryboards(storyboards, previewStoryboard) {
    return [...(storyboards || []), previewStoryboard]
      .filter(Boolean)
      .sort((a, b) => b.width - a.width);
  }

  // Smallest storyboard that still looks sharp at the given display height.
  function storyboardForHeight(boards, height) {
    const sharp = boards.filter((board) => board.height >= height * 0.9);
    return sharp.at(-1) || boards[0] || null;
  }

  function storyboardFrame(board, seconds, duration) {
    const perSheet = board.columns * board.rows;
    const last = board.sheets.length * perSheet - 1;
    let index = Math.floor(Math.max(0, seconds) / board.interval);
    if (duration) index = Math.min(index, Math.floor(Math.max(0, duration - 0.001) / board.interval));
    index = clamp(index, 0, last);
    const within = index % perSheet;
    return {
      url: board.sheets[Math.floor(index / perSheet)],
      column: within % board.columns,
      row: Math.floor(within / board.columns),
    };
  }

  // Width-only sizing keeps partial last sheets (fewer rows) undistorted.
  function paintStoryboardFrame(element, board, frame, width, height) {
    element.style.backgroundImage = cssImageUrl(frame.url);
    element.style.backgroundSize = (board.columns * width) + 'px auto';
    element.style.backgroundPosition = (-frame.column * width) + 'px ' + (-frame.row * height) + 'px';
  }

  // One shared hover card shows the frame under the pointer or dragged handle.
  // Storyboard frames appear instantly; once the preview video is downloaded,
  // a hidden video seeks to the exact time and its frame is drawn on top.
  const FRAME_TIP_WIDTH = 240;
  const frameTip = document.createElement('div');
  frameTip.className = 'frame-tip';
  frameTip.hidden = true;
  frameTip.setAttribute('aria-hidden', 'true');
  const frameTipImage = document.createElement('div');
  frameTipImage.className = 'frame-tip-image';
  const frameTipCanvas = document.createElement('canvas');
  frameTipImage.append(frameTipCanvas);
  const frameTipTime = document.createElement('p');
  frameTipTime.className = 'frame-tip-time';
  frameTip.append(frameTipImage, frameTipTime);
  document.body.append(frameTip);

  const frameVideo = document.createElement('video');
  frameVideo.muted = true;
  frameVideo.preload = 'auto';
  frameVideo.playsInline = true;
  const frameSeek = { busy: false, target: null, source: '' };

  function pumpFrameSeek() {
    if (frameSeek.busy || frameSeek.target === null || frameVideo.readyState < 1) return;
    const target = frameSeek.target;
    frameSeek.target = null;
    frameSeek.busy = true;
    const end = Number.isFinite(frameVideo.duration) ? Math.max(0, frameVideo.duration - 0.05) : target;
    frameVideo.currentTime = Math.min(target, end);
  }

  frameVideo.addEventListener('loadedmetadata', pumpFrameSeek);
  frameVideo.addEventListener('seeked', () => {
    frameSeek.busy = false;
    if (!frameTip.hidden && frameVideo.videoWidth) {
      const context = frameTipCanvas.getContext('2d');
      context.drawImage(frameVideo, 0, 0, frameTipCanvas.width, frameTipCanvas.height);
      frameTipCanvas.hidden = false;
    }
    pumpFrameSeek();
  });
  frameVideo.addEventListener('error', () => {
    frameSeek.busy = false;
  });

  function requestExactFrame(source, seconds) {
    if (!source) {
      frameTipCanvas.hidden = true;
      return;
    }
    if (frameSeek.source !== source) {
      frameSeek.source = source;
      frameSeek.busy = false;
      frameTipCanvas.hidden = true;
      frameVideo.src = source;
    }
    frameSeek.target = seconds;
    pumpFrameSeek();
  }

  function showFrameTip(track, seconds, view, board, source, duration) {
    const aspect = board ? board.height / board.width : 9 / 16;
    const width = FRAME_TIP_WIDTH;
    const height = Math.round(width * aspect);
    frameTipImage.style.height = height + 'px';
    const ratio = window.devicePixelRatio || 1;
    if (frameTipCanvas.width !== width * ratio || frameTipCanvas.height !== height * ratio) {
      frameTipCanvas.width = width * ratio;
      frameTipCanvas.height = height * ratio;
    }
    if (board) {
      paintStoryboardFrame(frameTipImage, board, storyboardFrame(board, seconds, duration), width, height);
    } else {
      frameTipImage.style.backgroundImage = '';
    }
    frameTipTime.textContent = formatClipTime(seconds);
    frameTip.hidden = false;
    if (!board && !source) frameTipImage.hidden = true;
    else frameTipImage.hidden = false;
    requestExactFrame(source, seconds);

    const rect = track.getBoundingClientRect();
    const x = rect.left + percentInView(seconds, view) / 100 * rect.width;
    const tipHeight = frameTip.offsetHeight;
    let top = rect.top - tipHeight - 8;
    if (top < 4) top = rect.bottom + 8;
    frameTip.style.left = clamp(x - width / 2, 4, window.innerWidth - width - 6) + 'px';
    frameTip.style.top = top + 'px';
  }

  function hideFrameTip() {
    frameTip.hidden = true;
    frameSeek.target = null;
  }

  function appendClipTrack(parent, options) {
    const viewState = options.viewState;
    const boards = combinedStoryboards(options.storyboards, options.previewStoryboard);
    const hoverBoard = boards[0] || null;

    const wrap = document.createElement('div');
    wrap.className = 'clip-track-wrap';

    const track = document.createElement('div');
    track.className = 'clip-track';
    const thumbnail = cssImageUrl(options.thumbnail);
    const frames = document.createElement('div');
    frames.className = 'clip-frames';
    if (boards.length) {
      track.classList.add('has-frames');
    } else if (thumbnail) {
      track.classList.add('has-thumb');
      track.style.setProperty('--clip-thumb', thumbnail);
    }

    const leftOutside = document.createElement('div');
    leftOutside.className = 'clip-outside';

    const rightOutside = document.createElement('div');
    rightOutside.className = 'clip-outside';

    const fill = document.createElement('div');
    fill.className = 'clip-range-fill';

    const cursor = document.createElement('div');
    cursor.className = 'clip-cursor';
    cursor.hidden = true;

    const startHandle = document.createElement('button');
    startHandle.type = 'button';
    startHandle.className = 'clip-handle';
    startHandle.setAttribute('aria-label', 'Clip start');
    startHandle.setAttribute('role', 'slider');

    const endHandle = document.createElement('button');
    endHandle.type = 'button';
    endHandle.className = 'clip-handle';
    endHandle.setAttribute('aria-label', 'Clip end');
    endHandle.setAttribute('role', 'slider');

    const tools = document.createElement('div');
    tools.className = 'clip-track-tools';

    const note = document.createElement('p');
    note.className = 'clip-track-note';

    const zoomControls = document.createElement('div');
    zoomControls.className = 'clip-track-zoom';

    const zoomOut = document.createElement('button');
    zoomOut.type = 'button';
    zoomOut.className = 'preview-clip clip-zoom';
    setButtonIcon(zoomOut, 'minus');
    zoomOut.title = 'Zoom out';
    zoomOut.setAttribute('aria-label', 'Zoom out');

    const zoomFit = document.createElement('button');
    zoomFit.type = 'button';
    zoomFit.className = 'preview-clip clip-zoom';
    setButtonIcon(zoomFit, 'reset');
    zoomFit.title = 'Fit selection';
    zoomFit.setAttribute('aria-label', 'Fit selection');

    const zoomIn = document.createElement('button');
    zoomIn.type = 'button';
    zoomIn.className = 'preview-clip clip-zoom';
    setButtonIcon(zoomIn, 'add');
    zoomIn.title = 'Zoom in';
    zoomIn.setAttribute('aria-label', 'Zoom in');

    zoomControls.append(zoomOut, zoomFit, zoomIn);
    tools.append(note, zoomControls);

    let dragging = null;
    let dragView = null;
    let hovering = false;
    let framesKey = '';
    let values = clipTrackValues(options.getStartText(), options.getEndText(), options.duration);
    let view = clipTrackView(values, viewState);

    function setZoom(value) {
      viewState.zoom = value;
      viewState.anchor = null;
      refresh();
    }

    function renderFrames() {
      const board = storyboardForHeight(boards, track.clientHeight || 88);
      const width = track.clientWidth;
      const height = track.clientHeight;
      if (!board || !width || !height) return;
      const key = [board.sheets[0], view.start, view.end, width, height].join('|');
      if (key === framesKey) return;
      framesKey = key;
      const tileWidth = height * board.width / board.height;
      const count = Math.max(1, Math.ceil(width / tileWidth));
      const secondsPerTile = view.duration * tileWidth / width;
      const tiles = [];
      for (let index = 0; index < count; index += 1) {
        const tile = document.createElement('div');
        tile.className = 'clip-frame';
        tile.style.left = (index * tileWidth) + 'px';
        tile.style.width = tileWidth + 'px';
        const seconds = view.start + (index + 0.5) * secondsPerTile;
        paintStoryboardFrame(tile, board, storyboardFrame(board, seconds, values.duration), tileWidth, height);
        tiles.push(tile);
      }
      frames.replaceChildren(...tiles);
    }

    function refresh() {
      values = clipTrackValues(options.getStartText(), options.getEndText(), options.duration);
      view = dragView || clipTrackView(values, viewState);
      const startPercent = percentInView(values.start, view);
      const endPercent = percentInView(values.end, view);
      leftOutside.style.left = '0';
      leftOutside.style.width = startPercent + '%';
      rightOutside.style.left = endPercent + '%';
      rightOutside.style.width = Math.max(0, 100 - endPercent) + '%';
      fill.style.left = startPercent + '%';
      fill.style.width = Math.max(0, endPercent - startPercent) + '%';
      startHandle.style.left = startPercent + '%';
      endHandle.style.left = endPercent + '%';
      startHandle.hidden = values.start < view.start || values.start > view.end;
      endHandle.hidden = values.end < view.start || values.end > view.end;
      startHandle.setAttribute('aria-valuemin', '0');
      startHandle.setAttribute('aria-valuemax', String(values.end));
      startHandle.setAttribute('aria-valuenow', String(values.start));
      startHandle.setAttribute('aria-valuetext', formatClipTime(values.start));
      endHandle.setAttribute('aria-valuemin', String(values.start));
      endHandle.setAttribute('aria-valuemax', String(values.duration));
      endHandle.setAttribute('aria-valuenow', String(values.end));
      endHandle.setAttribute('aria-valuetext', formatClipTime(values.end));

      if (boards.length) renderFrames();

      const zoomable = !options.disabled && values.isKnownDuration;
      const zoom = resolvedClipZoom(values, viewState.zoom);
      zoomOut.disabled = !zoomable || zoom <= 1;
      zoomFit.disabled = !zoomable || viewState.zoom === null;
      zoomIn.disabled = !zoomable || zoom >= CLIP_ZOOMS.at(-1) || view.duration <= MIN_VIEW_SECONDS;
      note.textContent = (options.loading ? 'loading timeline, ' : options.previewLoading ? 'loading exact frames, ' : '') +
        'selection ' + formatClipTime(values.end - values.start) +
        ', view ' + formatClipTime(view.start) + '-' + formatClipTime(view.end) +
        ' of ' + formatClipTime(values.duration) +
        ', ' + zoom + 'x' + (viewState.zoom === null && zoom > 1 ? ' fit' : '') +
        (values.isKnownDuration ? '' : ', length unknown');
    }

    function secondsAt(clientX) {
      const rect = track.getBoundingClientRect();
      return clamp((clientX - rect.left) / rect.width * view.duration + view.start, 0, values.duration);
    }

    function showTipAt(seconds) {
      showFrameTip(track, seconds, view, hoverBoard, options.previewSource, values.duration);
      cursor.hidden = false;
      cursor.style.left = percentInView(seconds, view) + '%';
    }

    function hideTip() {
      cursor.hidden = true;
      hideFrameTip();
    }

    function setFromPointer(event, handle) {
      let seconds = secondsAt(event.clientX);
      // Dragging past an edge pans the frozen view instead of stopping there.
      const rect = track.getBoundingClientRect();
      if (dragView && (event.clientX < rect.left || event.clientX > rect.right)) {
        const overflow = event.clientX < rect.left
          ? (event.clientX - rect.left) / rect.width * view.duration
          : (event.clientX - rect.right) / rect.width * view.duration;
        seconds = clamp((overflow < 0 ? view.start : view.end) + overflow, 0, values.duration);
        const viewStart = overflow < 0 ? seconds : seconds - view.duration;
        dragView = viewAt(values, viewStart, view.duration, view.zoom);
      }
      const gap = Math.min(0.1, values.duration / 1000);
      let start = values.start;
      let end = values.end;
      if (handle === 'start') {
        start = Math.min(seconds, end - gap);
      } else {
        end = Math.max(seconds, start + gap);
      }
      start = clamp(start, 0, values.duration);
      end = clamp(end, 0, values.duration);
      options.onChange(formatClipTime(start), formatClipTime(end));
      refresh();
      showTipAt(handle === 'start' ? values.start : values.end);
    }

    function beginDrag(event, handle) {
      if (options.disabled) return;
      dragging = handle;
      viewState.focus = handle;
      dragView = view;
      clipDragActive = true;
      track.setPointerCapture?.(event.pointerId);
      event.preventDefault();
      event.stopPropagation();
      setFromPointer(event, handle);
    }

    function adjustWithKeyboard(event, handle) {
      if (options.disabled) return;
      const fine = clamp(view.duration / 200, 0.04, 1);
      const step = event.shiftKey ? fine * 10 : fine;
      const gap = Math.min(0.1, values.duration / 1000);
      let seconds;
      if (event.key === 'Home') seconds = handle === 'start' ? 0 : values.start + gap;
      else if (event.key === 'End') seconds = handle === 'start' ? values.end - gap : values.duration;
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') seconds = (handle === 'start' ? values.start : values.end) - step;
      else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') seconds = (handle === 'start' ? values.start : values.end) + step;
      else return;
      event.preventDefault();
      viewState.focus = handle;
      const start = handle === 'start' ? clamp(seconds, 0, values.end - gap) : values.start;
      const end = handle === 'end' ? clamp(seconds, values.start + gap, values.duration) : values.end;
      options.onChange(formatClipTime(start), formatClipTime(end));
      const moved = handle === 'start' ? start : end;
      if (moved < view.start || moved > view.end) viewState.anchor = null;
      refresh();
      showTipAt(handle === 'start' ? values.start : values.end);
      if (options.onChangeEnd) options.onChangeEnd();
    }

    zoomOut.addEventListener('click', () => setZoom(stepClipZoom(values, viewState.zoom, -1)));
    zoomFit.addEventListener('click', () => setZoom(null));
    zoomIn.addEventListener('click', () => setZoom(stepClipZoom(values, viewState.zoom, 1)));
    track.addEventListener('pointerdown', (event) => {
      const seconds = secondsAt(event.clientX);
      const handle = Math.abs(seconds - values.start) <= Math.abs(seconds - values.end) ? 'start' : 'end';
      beginDrag(event, handle);
    });
    startHandle.addEventListener('pointerdown', (event) => beginDrag(event, 'start'));
    endHandle.addEventListener('pointerdown', (event) => beginDrag(event, 'end'));
    startHandle.addEventListener('keydown', (event) => adjustWithKeyboard(event, 'start'));
    endHandle.addEventListener('keydown', (event) => adjustWithKeyboard(event, 'end'));
    startHandle.addEventListener('blur', hideTip);
    endHandle.addEventListener('blur', hideTip);
    track.addEventListener('pointerenter', () => {
      hovering = true;
    });
    track.addEventListener('pointerleave', () => {
      hovering = false;
      if (!dragging) hideTip();
    });
    track.addEventListener('pointermove', (event) => {
      if (dragging) setFromPointer(event, dragging);
      else if (event.pointerType !== 'touch') showTipAt(secondsAt(event.clientX));
    });
    function finishDrag() {
      if (dragging) {
        viewState.zoom = view.zoom;
        viewState.anchor = view.start;
        if (options.onChangeEnd) options.onChangeEnd();
      }
      dragging = null;
      dragView = null;
      refresh();
      if (!hovering) hideTip();
      endClipDrag();
    }
    track.addEventListener('pointerup', finishDrag);
    track.addEventListener('pointercancel', finishDrag);

    new ResizeObserver(() => {
      if (track.isConnected && boards.length) renderFrames();
    }).observe(track);

    track.append(frames, leftOutside, rightOutside, fill, cursor, startHandle, endHandle);
    wrap.append(track, tools);
    parent.append(wrap);
    refresh();
    return refresh;
  }

  function clipPreviewUrl(source) {
    return safeThumbnailUrl(source);
  }

  function clearPreviewPanel(parent) {
    for (const video of parent.querySelectorAll('video')) {
      video.pause();
      video.removeAttribute('src');
      video.load();
    }
    parent.replaceChildren();
  }

  function appendClipPreview(parent, source, clip, loading, autoPlay = false) {
    if (!clip.ok || !clip.clip) {
      const note = document.createElement('p');
      note.className = 'clip-preview-note';
      note.textContent = clip.error || 'set a start and end to preview';
      parent.append(note);
      return false;
    }
    if (loading || !source) {
      const note = document.createElement('p');
      note.className = 'clip-preview-note';
      note.textContent = loading ? 'building preview video' : 'preview video unavailable';
      parent.append(note);
      return false;
    }

    const start = clip.clip.start;
    const end = clip.clip.end;
    const video = document.createElement('video');
    video.className = 'clip-preview-player';
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = clipPreviewUrl(source);
    video.dataset.previewSource = video.src;
    video.dataset.clipStart = String(start);
    video.dataset.clipEnd = String(end);
    let shouldPlay = autoPlay;

    function seekToStart() {
      try {
        if (video.currentTime < start || video.currentTime >= end || Math.abs(video.currentTime - start) > 0.15) {
          video.currentTime = start;
        }
      } catch {}
    }

    function playWhenReady() {
      seekToStart();
      if (video.readyState >= 3 && Math.abs(video.currentTime - start) <= 0.25) {
        shouldPlay = false;
        void video.play().catch(() => {});
      }
    }

    video.addEventListener('loadedmetadata', () => {
      seekToStart();
      if (shouldPlay) playWhenReady();
    });
    video.addEventListener('canplay', () => {
      if (shouldPlay) playWhenReady();
    });
    video.addEventListener('seeked', () => {
      if (shouldPlay) playWhenReady();
    });
    video.addEventListener('play', () => {
      if (video.currentTime < start || video.currentTime >= end) seekToStart();
    });
    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= end) {
        video.pause();
        seekToStart();
      }
    });
    parent.append(video);
    return true;
  }

  function canReuseClipPreview(video, source, clip) {
    return Boolean(
      video &&
      clip.ok &&
      clip.clip &&
      video.dataset.previewSource === clipPreviewUrl(source) &&
      video.dataset.clipStart === String(clip.clip.start) &&
      video.dataset.clipEnd === String(clip.clip.end)
    );
  }

  function replayInputPreview() {
    if (!inputClipPreviewOpen) return;
    inputClipPreviewAutoPlay = true;
    if (!inputClipPreviewSource && !inputClipPreviewLoading) void loadInputClipPreview();
    renderInputClipPreview(true);
  }

  function scheduleInputPreviewReplay() {
    if (!inputClipPreviewOpen) return;
    if (inputClipPreviewReplayTimer) clearTimeout(inputClipPreviewReplayTimer);
    inputClipPreviewReplayTimer = setTimeout(() => {
      inputClipPreviewReplayTimer = null;
      replayInputPreview();
    }, 300);
  }

  function renderInputClipTrack(showPanel) {
    if (!showPanel) {
      inputClipTrack.replaceChildren();
      inputClipTrackState = null;
      return;
    }
    // updateControls runs on every keystroke and render; rebuilding the track
    // each time is wasted work unless its inputs changed.
    const key = [
      inputClipDuration,
      inputClipThumbnail,
      inputClipStoryboards.length,
      inputClipPreviewStoryboard?.sheets[0],
      inputClipPreviewSource,
      inputClipLoading,
      inputClipPreviewLoading,
    ].join('|');
    if (inputClipTrackState && inputClipTrackState.key === key) {
      inputClipTrackState.refresh();
      return;
    }
    inputClipTrack.replaceChildren();
    const refresh = appendClipTrack(inputClipTrack, {
      duration: inputClipDuration,
      thumbnail: inputClipThumbnail,
      storyboards: inputClipStoryboards,
      previewStoryboard: inputClipPreviewStoryboard,
      previewSource: inputClipPreviewSource,
      loading: inputClipLoading,
      previewLoading: inputClipPreviewLoading,
      disabled: false,
      getStartText: () => inputClipStart.value,
      getEndText: () => inputClipEnd.value,
      viewState: inputClipView,
      onChange: (start, end) => {
        inputClipStart.value = start;
        inputClipEnd.value = end;
        setStatus('');
        clipInputButton.classList.add('active');
        inputClipClear.disabled = false;
        inputClipPreviewButton.disabled = false;
        inputClipDownloadButton.disabled = groupRunning || activeCount() >= MAX_ACTIVE_JOBS;
      },
      onChangeEnd: () => {
        replayInputPreview();
      },
    });
    inputClipTrackState = { key, refresh };
  }

  function renderInputClipPreview(showPanel) {
    const clip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    const existingVideo = inputClipPreviewPanel.querySelector('video');
    if (
      showPanel &&
      inputClipPreviewOpen &&
      !inputClipPreviewLoading &&
      !inputClipPreviewAutoPlay &&
      canReuseClipPreview(existingVideo, inputClipPreviewSource, clip)
    ) return;
    clearPreviewPanel(inputClipPreviewPanel);
    if (!showPanel || !inputClipPreviewOpen) return;
    const played = appendClipPreview(
      inputClipPreviewPanel,
      inputClipPreviewSource,
      clip,
      inputClipPreviewLoading,
      inputClipPreviewAutoPlay,
    );
    if (played) inputClipPreviewAutoPlay = false;
  }

  function renderClipPanel(item, reusableVideo = null) {
    const panel = document.createElement('div');
    panel.className = 'clip-panel';
    const previewPanel = document.createElement('div');
    previewPanel.className = 'clip-preview-panel';
    let refreshTrack = () => {};

    function renderRowPreview(autoPlay = false) {
      const clip = clipPayload(item);
      const shouldAutoPlay = autoPlay || item.clipPreviewAutoPlay;
      if (
        item.clipPreviewOpen &&
        !item.previewLoading &&
        !shouldAutoPlay &&
        canReuseClipPreview(reusableVideo, item.previewSource, clip)
      ) {
        previewPanel.append(reusableVideo);
        reusableVideo = null;
        return;
      }
      reusableVideo = null;
      clearPreviewPanel(previewPanel);
      if (!item.clipPreviewOpen) return;
      const played = appendClipPreview(
        previewPanel,
        item.previewSource,
        clip,
        item.previewLoading,
        shouldAutoPlay,
      );
      if (played) item.clipPreviewAutoPlay = false;
    }

    function replayRowPreview() {
      if (!item.clipPreviewOpen) return;
      item.clipPreviewAutoPlay = true;
      if (!item.previewSource && !item.previewLoading) {
        item.previewRequested = true;
        void loadPreview(item);
      }
      renderRowPreview(true);
    }

    function scheduleRowPreviewReplay() {
      if (!item.clipPreviewOpen) return;
      if (item.clipPreviewReplayTimer) clearTimeout(item.clipPreviewReplayTimer);
      item.clipPreviewReplayTimer = setTimeout(() => {
        item.clipPreviewReplayTimer = null;
        replayRowPreview();
      }, 300);
    }

    const startLabel = document.createElement('label');
    startLabel.className = 'clip-field';
    const startText = document.createElement('span');
    startText.textContent = 'start';
    const startInput = document.createElement('input');
    startInput.type = 'text';
    startInput.name = 'clip-start';
    startInput.dataset.clipField = 'start';
    startInput.value = item.clipStart;
    startInput.disabled = !canEditClip(item);
    startInput.setAttribute('aria-label', 'Clip start time');
    startInput.addEventListener('input', () => {
      item.clipStart = startInput.value;
      resetClipView(item.clipView);
      item.clipView.focus = 'start';
      if (clearClipValidation(item)) {
        renderAndRestoreClipFocus(item, 'start', startInput.selectionStart, startInput.selectionEnd);
      } else if (canEditClip(item)) {
        refreshTrack();
        previewClip.disabled = !canPreviewClipNow(item);
        clipDownload.disabled = !canDownloadClipNow(item);
        scheduleRowPreviewReplay();
        refreshMeta(item);
        updateControls();
      }
    });
    startLabel.append(startText, startInput);

    const endLabel = document.createElement('label');
    endLabel.className = 'clip-field';
    const endText = document.createElement('span');
    endText.textContent = 'end';
    const endInput = document.createElement('input');
    endInput.type = 'text';
    endInput.name = 'clip-end';
    endInput.dataset.clipField = 'end';
    endInput.value = item.clipEnd;
    endInput.disabled = !canEditClip(item);
    endInput.setAttribute('aria-label', 'Clip end time');
    endInput.addEventListener('input', () => {
      item.clipEnd = endInput.value;
      resetClipView(item.clipView);
      item.clipView.focus = 'end';
      if (clearClipValidation(item)) {
        renderAndRestoreClipFocus(item, 'end', endInput.selectionStart, endInput.selectionEnd);
      } else if (canEditClip(item)) {
        refreshTrack();
        previewClip.disabled = !canPreviewClipNow(item);
        clipDownload.disabled = !canDownloadClipNow(item);
        scheduleRowPreviewReplay();
        refreshMeta(item);
        updateControls();
      }
    });
    endLabel.append(endText, endInput);

    const clearClip = document.createElement('button');
    clearClip.type = 'button';
    clearClip.className = 'clear-clip';
    setButtonIcon(clearClip, 'reset');
    clearClip.setAttribute('aria-label', 'Reset clip');
    clearClip.title = 'Reset clip';
    clearClip.disabled = !canEditClip(item) || !hasClipText(item);
    clearClip.addEventListener('click', () => {
      item.clipStart = '';
      item.clipEnd = '';
      item.clipPreviewOpen = false;
      item.clipPreviewAutoPlay = false;
      if (item.clipPreviewReplayTimer) clearTimeout(item.clipPreviewReplayTimer);
      item.clipPreviewReplayTimer = null;
      item.clipView = newClipView();
      clearClipValidation(item);
      render();
    });

    const previewClip = document.createElement('button');
    previewClip.type = 'button';
    previewClip.className = 'preview-clip';
    setButtonIcon(previewClip, item.clipPreviewOpen ? 'close' : 'play');
    previewClip.setAttribute('aria-label', item.clipPreviewOpen ? 'Hide preview' : 'Preview clip');
    previewClip.title = 'Preview this clip';
    previewClip.disabled = !canPreviewClipNow(item);
    previewClip.addEventListener('click', () => {
      const clip = clipPayload(item);
      if (!clip.ok) {
        item.status = 'invalid';
        item.error = clip.error;
        setStatus(clip.error, true);
        render();
        return;
      }
      item.clipPreviewOpen = !item.clipPreviewOpen;
      item.clipPreviewAutoPlay = item.clipPreviewOpen;
      if (item.clipPreviewOpen && !item.previewSource) {
        item.previewRequested = true;
        void loadPreview(item);
      }
      render();
    });

    const clipDownload = document.createElement('button');
    clipDownload.type = 'button';
    clipDownload.className = 'preview-clip';
    setButtonIcon(clipDownload, 'download');
    clipDownload.setAttribute('aria-label', 'Download clip');
    clipDownload.title = 'Download this clip';
    clipDownload.disabled = !canDownloadClipNow(item);
    clipDownload.addEventListener('click', () => {
      const clip = clipPayload(item);
      if (!clip.ok) {
        item.status = 'invalid';
        item.error = clip.error;
        setStatus(clip.error, true);
        render();
        return;
      }
      if (item.status === 'canceled' || item.status === 'invalid') resetForQueue(item);
      startSingleItem(item);
    });

    panel.append(startLabel, endLabel, clearClip, previewClip, clipDownload);
    refreshTrack = appendClipTrack(panel, {
      duration: item.duration,
      thumbnail: item.thumbnail,
      storyboards: item.storyboards,
      previewStoryboard: item.previewStoryboard,
      previewSource: item.previewSource,
      loading: item.titleLoading,
      previewLoading: item.previewLoading,
      disabled: !canEditClip(item),
      getStartText: () => item.clipStart,
      getEndText: () => item.clipEnd,
      viewState: item.clipView,
      onChange: (start, end) => {
        item.clipStart = start;
        item.clipEnd = end;
        startInput.value = start;
        endInput.value = end;
        clearClipValidation(item);
        previewClip.disabled = !canPreviewClipNow(item);
        clipDownload.disabled = !canDownloadClipNow(item);
        refreshMeta(item);
        updateControls();
      },
      onChangeEnd: () => {
        replayRowPreview();
      },
    });
    renderRowPreview();
    if (item.clipPreviewOpen) panel.append(previewPanel);
    if (canEditClip(item) && !item.previewSource && !item.previewRequested) {
      item.previewRequested = true;
      window.setTimeout(() => loadPreview(item), 0);
    }
    return panel;
  }

  function renderAndRestoreClipFocus(item, field, selectionStart, selectionEnd) {
    render();
    const input = jobsList.querySelector(
      '[data-local-id="' + item.localId + '"] [data-clip-field="' + field + '"]',
    );
    if (!input) return;
    input.focus();
    if (selectionStart !== null && selectionEnd !== null) {
      input.setSelectionRange(selectionStart, selectionEnd);
    }
  }

  // Coalesces background updates (titles, previews) into one render per frame.
  function scheduleRender() {
    if (renderFrame) return;
    renderFrame = requestAnimationFrame(() => {
      renderFrame = 0;
      render();
    });
  }

  // Progress ticks only change the bar and status text, so patch those in
  // place instead of rebuilding every row.
  function patchProgress(item) {
    const row = rowElements.get(item.localId);
    const fill = row?.querySelector('.bar > div');
    const state = row?.querySelector('.job-progress .job-state');
    if (!fill || !state || renderFrame || renderQueued) {
      scheduleRender();
      return;
    }
    fill.style.transform = 'scaleX(' + progressScale(item) + ')';
    paintProgress(state, item);
  }

  function rowThumb(item) {
    const thumb = document.createElement('div');
    thumb.className = 'job-thumb';
    const url = safeThumbnailUrl(item.thumbnail);
    if (url) {
      const image = document.createElement('img');
      image.src = url;
      image.alt = '';
      thumb.append(image);
    } else {
      thumb.append(iconForSource(item.kind === 'compress' ? 'file' : sourceForUrl(item.url)));
    }
    return thumb;
  }

  function rowSub(item) {
    const sub = document.createElement('div');
    sub.className = 'job-sub';
    if (isActive(item) || item.status === 'saving') {
      sub.classList.add('job-progress');
      const bar = document.createElement('div');
      bar.className = 'bar';
      const fill = document.createElement('div');
      fill.style.transform = 'scaleX(' + progressScale(item) + ')';
      bar.append(fill);
      const state = document.createElement('p');
      state.className = 'job-state';
      const numbers = document.createElement('span');
      numbers.className = 'num';
      state.append(document.createElement('span'), numbers);
      paintProgress(state, item);
      sub.append(bar, state);
    } else if (item.status === 'failed' || item.status === 'invalid') {
      const state = document.createElement('p');
      state.className = 'job-state error';
      state.textContent = item.error || (item.status === 'failed' ? 'Download failed' : 'Clip is not valid');
      sub.append(state);
    } else {
      const meta = document.createElement('p');
      meta.className = 'job-meta';
      paintMeta(meta, item);
      sub.append(meta);
    }
    return sub;
  }

  function rowControls(item, active) {
    const controls = document.createElement('div');
    controls.className = 'row-controls';

    if (canEditClip(item)) {
      const clipToggle = document.createElement('button');
      clipToggle.type = 'button';
      clipToggle.className = 'clip-toggle reveal-on-hover';
      clipToggle.classList.toggle('active', hasClipText(item));
      setButtonIcon(clipToggle, 'clip');
      clipToggle.title = hasClipText(item) ? 'Edit clip' : 'Set clip';
      clipToggle.setAttribute('aria-label', clipToggle.title);
      clipToggle.setAttribute('aria-expanded', String(Boolean(item.clipOpen)));
      clipToggle.addEventListener('click', () => {
        item.clipOpen = !item.clipOpen;
        render();
      });
      controls.append(clipToggle);
    }

    if (item.status === 'complete') {
      const done = document.createElement('span');
      done.className = 'done-mark';
      done.setAttribute('role', 'img');
      done.setAttribute('aria-label', 'Done');
      done.title = 'Done';
      setButtonIcon(done, 'check');
      const saveAgain = document.createElement('button');
      saveAgain.type = 'button';
      saveAgain.className = 'text-action';
      setButtonText(saveAgain, 'download', 'Save again');
      saveAgain.title = 'Save the file again';
      saveAgain.disabled = !item.jobId;
      saveAgain.addEventListener('click', () => downloadFile(item));
      controls.append(done, saveAgain);
    } else if (isRetryable(item)) {
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'download-one text-action';
      setButtonText(retry, 'reset', 'Retry');
      retry.disabled = !canStartSingleDownload(item, active);
      retry.title = retry.disabled ? singleDownloadTitle(active) : 'Retry this download';
      retry.addEventListener('click', () => startSingleItem(item));
      controls.append(retry);
    } else {
      const downloadOne = document.createElement('button');
      downloadOne.type = 'button';
      downloadOne.className = 'download-one reveal-on-hover';
      setButtonIcon(downloadOne, 'download');
      downloadOne.title = singleDownloadTitle(active);
      downloadOne.disabled = !canStartSingleDownload(item, active);
      downloadOne.setAttribute('aria-label', downloadOneLabel(item));
      downloadOne.addEventListener('click', () => startSingleItem(item));
      controls.append(downloadOne);
    }

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove-job reveal-on-hover';
    setButtonIcon(remove, 'close');
    remove.title = isActive(item) ? 'Cancel this download' : 'Remove';
    remove.setAttribute('aria-label', isActive(item) ? 'Cancel this download' : 'Remove from list');
    remove.addEventListener('click', () => removeItem(item));
    controls.append(remove);
    return controls;
  }

  // New rows in one render form a batch and stagger their entrance.
  function markRowEntrance(row, item, now, batch) {
    if (!rowEnterAt.has(item.localId)) {
      rowEnterAt.set(item.localId, now + Math.min(batch.count, ROW_STAGGER_MAX_STEPS) * ROW_STAGGER_MS);
      batch.count += 1;
    }
    const delay = rowEnterAt.get(item.localId) - now;
    if (delay <= -ROW_ENTER_MS) return;
    row.classList.add('entering');
    row.style.animationDelay = delay + 'ms';
  }

  function render() {
    if (renderFrame) {
      cancelAnimationFrame(renderFrame);
      renderFrame = 0;
    }
    if (clipDragActive) {
      renderQueued = true;
      return;
    }
    renderQueued = false;
    const reusableVideos = new Map();
    for (const row of jobsList.querySelectorAll('.job[data-local-id]')) {
      const video = row.querySelector('.clip-preview-player');
      if (video) reusableVideos.set(row.dataset.localId, video);
    }
    const active = activeCount();
    const now = performance.now();
    const batch = { count: 0 };
    rowElements.clear();
    const nodes = items.map((item) => {
      const row = document.createElement('section');
      rowElements.set(item.localId, row);
      row.className = 'job';
      row.dataset.localId = String(item.localId);
      row.classList.toggle('complete', item.status === 'complete');
      row.classList.toggle('has-action', item.status === 'complete' || isRetryable(item));
      const clipOpen = canEditClip(item) && item.clipOpen;
      row.classList.toggle('clip-open', clipOpen);
      markRowEntrance(row, item, now, batch);

      const title = document.createElement('p');
      title.className = 'job-url';
      title.title = item.title || item.url;
      title.textContent = displayTitle(item);

      row.append(rowThumb(item), title, rowSub(item), rowControls(item, active));
      if (clipOpen) {
        row.append(renderClipPanel(item, reusableVideos.get(String(item.localId)) || null));
      }
      return row;
    });
    jobsList.replaceChildren(...nodes);
    updateControls();
  }

  function queueItem(
    url,
    selectedFormat = 'mp4',
    initialTitle = null,
    clipStart = '',
    clipEnd = '',
    playlist = null,
    renderNow = true,
  ) {
    const audioOnly = selectedFormat === 'audio' || sourceForUrl(url) === 'discord';
    const linkedClip = audioOnly ? null : clipRangeFromUrl(url);
    const start = audioOnly
      ? ''
      : clipStart || (linkedClip?.start !== null && linkedClip?.start !== undefined ? formatClipTime(linkedClip.start) : '');
    const end = audioOnly
      ? ''
      : clipEnd || (linkedClip?.end !== null && linkedClip?.end !== undefined ? formatClipTime(linkedClip.end) : '');
    const item = {
      localId: nextLocalId,
      kind: 'download',
      file: null,
      upload: null,
      url,
      title: initialTitle,
      titleLoading: !initialTitle && selectedFormat !== 'audio',
      duration: null,
      thumbnail: null,
      storyboards: [],
      previewStoryboard: null,
      previewSource: null,
      previewLoading: false,
      previewRequested: false,
      clipPreviewOpen: false,
      clipPreviewAutoPlay: false,
      clipPreviewReplayTimer: null,
      clipView: newClipView(),
      format: selectedFormat,
      playlist,
      status: 'queued',
      clipStart: start,
      clipEnd: end,
      clipOpen: Boolean(start || end),
      percent: null,
      downloadedBytes: null,
      totalBytes: null,
      bytesPerSecond: null,
      etaSeconds: null,
      error: null,
      jobId: null,
      activeClip: null,
      clipMode: null,
      attempt: 0,
      source: null,
      metadataPromise: null,
    };
    nextLocalId += 1;
    items.push(item);
    if (!initialTitle && selectedFormat !== 'audio') item.metadataPromise = loadTitle(item);
    if (renderNow) render();
    return item;
  }

  function queueFile(file) {
    const item = queueItem(file.name, 'mp4', file.name, '', '', null, false);
    item.kind = 'compress';
    item.file = file;
    return item;
  }

  async function loadTitle(item) {
    try {
      const response = await fetch('/api/metadata', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url: item.url }),
      });
      let data = {};
      try {
        data = await response.json();
      } catch {}
      if (!items.includes(item)) return;
      if (response.ok && data.title) item.title = data.title;
      if (response.ok) {
        item.duration = clipDurationFromMetadata(data);
        item.thumbnail = safeThumbnailUrl(data.thumbnail) || null;
        item.storyboards = sanitizeStoryboards(data.storyboards);
        if (item.format !== 'audio' && sourceForUrl(item.url) !== 'discord') {
          if (data.clip && !hasClipText(item)) {
            item.clipStart = formatClipTime(data.clip.start);
            item.clipEnd = formatClipTime(data.clip.end);
            item.clipOpen = true;
          } else if (hasClipText(item)) {
            const completed = completeClipText(item.clipStart, item.clipEnd, item.duration);
            item.clipStart = completed.start;
            item.clipEnd = completed.end;
          }
        }
      }
    } catch {
    } finally {
      if (items.includes(item)) {
        item.titleLoading = false;
        scheduleRender();
      }
    }
  }

  async function pollPreview(previewId, isCurrent) {
    for (let attempt = 0; attempt < 300; attempt += 1) {
      if (!isCurrent()) return null;
      const response = await fetch('/api/previews/' + previewId);
      let data = {};
      try {
        data = await response.json();
      } catch {}
      if (!response.ok) throw new Error(data.error || 'preview failed');
      if (data.status === 'done' && data.spriteUrl) return data;
      if (data.status === 'error') throw new Error(data.error || 'preview failed');
      await new Promise((resolve) => window.setTimeout(resolve, 500));
    }
    throw new Error('preview timed out');
  }

  async function startPreview(url, isCurrent) {
    const response = await fetch('/api/previews', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    let data = {};
    try {
      data = await response.json();
    } catch {}
    if (!response.ok) {
      const error = new Error(data.error || 'preview failed');
      error.status = response.status;
      throw error;
    }
    if (data.status === 'done' && data.spriteUrl) return data;
    if (!data.previewId) throw new Error('preview failed');
    return pollPreview(data.previewId, isCurrent);
  }

  async function loadPreview(item) {
    if (!items.includes(item) || item.previewSource || item.previewLoading) return;
    item.previewLoading = true;
    scheduleRender();
    try {
      const preview = await startPreview(item.url, () => items.includes(item));
      if (!items.includes(item) || !preview) return;
      item.previewStoryboard = sanitizeStoryboard(preview.storyboard);
      item.previewSource = safeThumbnailUrl(preview.sourceUrl) || null;
      if (typeof preview.duration === 'number' && Number.isFinite(preview.duration)) {
        item.duration = Math.max(item.duration || 0, preview.duration);
      }
    } catch (error) {
      if (error.status === 429 && items.includes(item)) {
        window.setTimeout(() => {
          if (!items.includes(item) || item.previewSource || !canEditClip(item)) return;
          item.previewRequested = false;
          scheduleRender();
        }, 1500);
      }
    } finally {
      if (items.includes(item)) {
        item.previewLoading = false;
        scheduleRender();
      }
    }
  }

  function scheduleInputClipMetadata() {
    if (inputClipMetadataTimer) clearTimeout(inputClipMetadataTimer);
    inputClipMetadataTimer = setTimeout(() => {
      inputClipMetadataTimer = null;
      void loadInputClipMetadata();
    }, 300);
  }

  function scheduleInputClipPreview() {
    if (inputClipPreviewTimer) clearTimeout(inputClipPreviewTimer);
    inputClipPreviewTimer = setTimeout(() => {
      inputClipPreviewTimer = null;
      void loadInputClipPreview();
    }, 800);
  }

  async function loadInputClipPreview() {
    const url = firstInputUrl();
    if (!url || inputClipPreviewLoading) return;
    if (url === inputClipPreviewUrl && inputClipPreviewSource) return;
    const token = inputClipPreviewToken + 1;
    inputClipPreviewToken = token;
    inputClipPreviewUrl = url;
    inputClipPreviewStoryboard = null;
    inputClipPreviewSource = null;
    inputClipPreviewLoading = true;
    updateInputClipControls(urlInput.value.trim().length > 0);

    try {
      const preview = await startPreview(url, () => token === inputClipPreviewToken);
      if (token !== inputClipPreviewToken || !preview) return;
      inputClipPreviewStoryboard = sanitizeStoryboard(preview.storyboard);
      inputClipPreviewSource = safeThumbnailUrl(preview.sourceUrl) || null;
      if (typeof preview.duration === 'number' && Number.isFinite(preview.duration)) {
        inputClipDuration = Math.max(inputClipDuration || 0, preview.duration);
      }
    } catch {
    } finally {
      if (token === inputClipPreviewToken) {
        inputClipPreviewLoading = false;
        updateControls();
      }
    }
  }

  async function loadInputClipMetadata() {
    const url = firstInputUrl();
    if (!url || inputClipLoading) return;
    if (url === inputClipMetadataUrl && (inputClipDuration !== null || inputClipThumbnail || inputClipTitle)) return;
    const token = inputClipMetadataToken + 1;
    inputClipMetadataToken = token;
    inputClipMetadataUrl = url;
    inputClipDuration = null;
    inputClipThumbnail = null;
    inputClipTitle = null;
    inputClipStoryboards = [];
    inputClipLoading = true;
    updateInputClipControls(urlInput.value.trim().length > 0);

    try {
      const response = await fetch('/api/metadata', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      let data = {};
      try {
        data = await response.json();
      } catch {}
      if (token !== inputClipMetadataToken || !response.ok) return;
      inputClipDuration = clipDurationFromMetadata(data);
      inputClipThumbnail = safeThumbnailUrl(data.thumbnail) || null;
      inputClipTitle = typeof data.title === 'string' && data.title ? data.title : null;
      inputClipStoryboards = sanitizeStoryboards(data.storyboards);
      if (data.clip && !hasInputClipText()) {
        inputClipStart.value = formatClipTime(data.clip.start);
        inputClipEnd.value = formatClipTime(data.clip.end);
        inputClipOpen = true;
      } else if (hasInputClipText()) {
        const completed = completeClipText(
          inputClipStart.value,
          inputClipEnd.value,
          inputClipDuration,
        );
        inputClipStart.value = completed.start;
        inputClipEnd.value = completed.end;
      }
    } catch {
    } finally {
      if (token === inputClipMetadataToken) {
        inputClipLoading = false;
        updateControls();
      }
    }
  }

  function resetInputMetadataIfUrlChanged() {
    const url = firstInputUrl();
    if (url === inputClipMetadataUrl) return;
    inputClipDuration = null;
    inputClipThumbnail = null;
    inputClipTitle = null;
    inputClipStoryboards = [];
    inputClipPreviewStoryboard = null;
    inputClipPreviewSource = null;
    inputClipPreviewOpen = false;
    inputClipPreviewAutoPlay = false;
    resetClipView(inputClipView);
    inputClipMetadataUrl = '';
    inputClipPreviewUrl = '';
    inputClipLoading = false;
    inputClipPreviewLoading = false;
    inputClipMetadataToken += 1;
    inputClipPreviewToken += 1;
    if (inputClipMetadataTimer) clearTimeout(inputClipMetadataTimer);
    if (inputClipPreviewTimer) clearTimeout(inputClipPreviewTimer);
    if (inputClipPreviewReplayTimer) clearTimeout(inputClipPreviewReplayTimer);
    inputClipMetadataTimer = null;
    inputClipPreviewTimer = null;
    inputClipPreviewReplayTimer = null;
  }

  async function queueInput() {
    if (inputResolving) return [];
    const urls = urlInput.value.trim().split(/\s+/).filter(Boolean);
    if (urls.length === 0) return [];
    const clipStart = inputClipStart.value.trim();
    const clipEnd = inputClipEnd.value.trim();
    const queued = [];
    const failedUrls = [];
    const resolveToken = inputResolveToken + 1;
    inputResolveToken = resolveToken;
    let lastError = null;

    urlInput.value = '';
    resetInputClip();
    inputResolving = urls.some((url) => sourceForUrl(url) === 'soundcloud');
    if (inputResolving) setStatus('loading SoundCloud tracks');
    render();

    try {
      for (const url of urls) {
        if (sourceForUrl(url) !== 'soundcloud') {
          const format = sourceForUrl(url) === 'discord' ? 'mp3' : 'mp4';
          queued.push(queueItem(url, format, null, clipStart, clipEnd, null, false));
          continue;
        }

        try {
          const response = await fetch('/api/soundcloud', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          let data = {};
          try {
            data = await response.json();
          } catch {}
          if (resolveToken !== inputResolveToken) return queued;
          if (!response.ok) throw new Error(data.error || 'could not load SoundCloud tracks');
          if (!Array.isArray(data.tracks) || data.tracks.length === 0) {
            throw new Error('SoundCloud returned no tracks');
          }

          const count = data.tracks.length;
          data.tracks.forEach((track, index) => {
            if (!track || typeof track.url !== 'string') return;
            const playlist = count > 1 ? { index: index + 1, count } : null;
            queued.push(queueItem(
              track.url,
              'audio',
              typeof track.title === 'string' ? track.title : null,
              '',
              '',
              playlist,
              false,
            ));
          });
        } catch (error) {
          failedUrls.push(url);
          lastError = error instanceof Error && error.message
            ? error.message
            : 'could not load SoundCloud tracks';
        }
      }
    } finally {
      if (resolveToken === inputResolveToken) {
        inputResolving = false;
        if (failedUrls.length > 0) {
          const currentInput = urlInput.value.trim();
          urlInput.value = [...failedUrls, currentInput].filter(Boolean).join(' ');
        }
        setStatus(lastError || '', Boolean(lastError));
        render();
      }
    }
    return queued;
  }

  function downloadFile(item) {
    if (!item.jobId) return;
    const link = document.createElement('a');
    link.href = '/api/jobs/' + item.jobId + '/file';
    link.download = '';
    document.body.append(link);
    link.click();
    link.remove();
  }

  function finishItem(item, status, message = null) {
    if (item.source) item.source.close();
    item.source = null;
    item.status = status;
    item.error = message;

    if (groupRunning) {
      runQueue();
    } else {
      render();
    }
  }

  async function startItem(item) {
    if (item.status !== 'queued') return;

    // A row can be canceled and retried while an older POST or event stream is
    // still in flight. Each start gets an attempt number so stale responses
    // cannot attach their job to the retried row.
    const attempt = item.attempt + 1;
    item.attempt = attempt;
    const isCurrent = () => item.attempt === attempt && items.includes(item);

    item.status = 'starting';
    item.error = null;
    render();

    if (item.kind === 'compress') {
      await startCompress(item);
      return;
    }

    if (item.titleLoading && hasClipText(item) && item.metadataPromise) {
      await item.metadataPromise;
      if (!isCurrent() || item.status !== 'starting') return;
    }

    const clip = clipPayload(item);
    if (!clip.ok) {
      item.status = 'invalid';
      item.error = clip.error;
      setStatus(clip.error, true);
      if (groupRunning) runQueue();
      else render();
      return;
    }

    setStatus('');
    item.activeClip = clip.clip;
    render();
    const body = { url: item.url, format: item.format };
    if (clip.clip) body.clip = clip.clip;
    if (item.playlist) body.playlist = item.playlist;

    let data;
    try {
      const response = await fetch('/api/jobs', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      try {
        data = await response.json();
      } catch {
        data = {};
      }
      if (!response.ok) {
        if (isCurrent() && item.status === 'starting') {
          finishItem(item, 'failed', data.error || 'could not start download');
        }
        return;
      }
    } catch {
      if (isCurrent() && item.status === 'starting') {
        finishItem(item, 'failed', 'could not reach server');
      }
      return;
    }

    if (!isCurrent() || item.status !== 'starting') {
      await cancelServerJobId(data.jobId);
      if (isCurrent()) {
        render();
        if (groupRunning) runQueue();
      }
      return;
    }
    item.jobId = data.jobId;
    item.clipMode = data.clipMode === 'section' || data.clipMode === 'full' ? data.clipMode : null;

    followJob(item);
  }

  function uploadFile(item) {
    return new Promise((resolve, reject) => {
      const request = new XMLHttpRequest();
      item.upload = request;
      request.open('POST', '/api/compress?name=' + encodeURIComponent(item.file.name));
      request.setRequestHeader('content-type', 'application/octet-stream');
      request.upload.onprogress = (event) => {
        if (!event.lengthComputable || item.status !== 'uploading') return;
        const percent = (event.loaded / event.total) * 100;
        const changed = Math.floor(percent) !== Math.floor(item.percent ?? -1);
        item.percent = percent;
        if (changed) render();
      };
      request.onload = () => {
        let data = {};
        try {
          data = JSON.parse(request.responseText);
        } catch {}
        if (request.status === 201 && data.jobId) resolve(data);
        else reject(new Error(data.error || 'could not upload file'));
      };
      request.onerror = () => reject(new Error('could not reach server'));
      request.onabort = () => reject(new Error('upload canceled'));
      request.send(item.file);
    });
  }

  async function startCompress(item) {
    item.status = 'uploading';
    item.percent = 0;
    render();

    let data;
    try {
      data = await uploadFile(item);
    } catch (error) {
      item.upload = null;
      if (item.status === 'canceled') return;
      finishItem(item, 'failed', error.message);
      return;
    }
    item.upload = null;
    item.jobId = data.jobId;
    if (item.status === 'canceled') {
      await cancelServerJob(item);
      render();
      if (groupRunning) runQueue();
      return;
    }
    item.percent = null;
    followJob(item);
  }

  function followJob(item) {
    const source = new EventSource('/api/jobs/' + item.jobId + '/events');
    item.source = source;
    const attempt = item.attempt;
    const isLive = () => item.source === source && item.attempt === attempt && items.includes(item);

    source.addEventListener('progress', (event) => {
      if (!isLive()) return;
      let progress;
      try {
        progress = JSON.parse(event.data);
      } catch {
        return;
      }
      if (progress.stage === 'downloading') {
        item.status = 'downloading';
        item.percent = progress.percent;
        item.downloadedBytes = progress.downloadedBytes;
        item.totalBytes = progress.totalBytes;
        item.bytesPerSecond = progress.bytesPerSecond ?? null;
        item.etaSeconds = progress.etaSeconds ?? null;
      } else if (progress.stage === 'compressing') {
        item.status = 'compressing';
        item.percent = progress.percent;
      } else {
        item.status = 'processing';
      }
      patchProgress(item);
    });

    source.addEventListener('done', () => {
      source.close();
      if (!isLive()) return;
      item.source = null;
      item.status = 'saving';
      render();
      downloadFile(item);
      window.setTimeout(() => {
        if (item.attempt === attempt && item.status === 'saving') finishItem(item, 'complete');
      }, 700);
    });

    source.addEventListener('failed', (event) => {
      if (isLive()) finishItem(item, 'failed', event.data || 'failed');
    });

    source.addEventListener('canceled', () => {
      if (isLive()) finishItem(item, 'canceled');
    });

    source.onerror = () => {
      if (isLive() && isActive(item)) finishItem(item, 'failed', 'lost connection to server');
    };
  }

  function resetForQueue(item) {
    item.status = 'queued';
    item.percent = null;
    item.downloadedBytes = null;
    item.totalBytes = null;
    item.bytesPerSecond = null;
    item.etaSeconds = null;
    item.error = null;
    item.jobId = null;
    item.source = null;
    item.activeClip = null;
    item.clipMode = null;
    item.upload = null;
  }

  function reactivateRetryableItems() {
    for (const item of items) {
      if (isRetryable(item)) resetForQueue(item);
    }
  }

  function startSingleItem(item) {
    if (groupRunning || activeCount() >= MAX_ACTIVE_JOBS) return;
    if (isRetryable(item)) resetForQueue(item);
    if (item.status !== 'queued') return;
    groupRunning = false;
    void startItem(item);
  }

  function runQueue() {
    while (activeCount() < MAX_ACTIVE_JOBS) {
      const item = items.find((candidate) => candidate.status === 'queued');
      if (!item) break;
      void startItem(item);
    }
    if (queuedCount() === 0 && activeCount() === 0) {
      groupRunning = false;
    }
    render();
  }

  async function cancelServerJobId(jobId) {
    if (!jobId) return;
    try {
      await fetch('/api/jobs/' + jobId, { method: 'DELETE' });
    } catch {}
  }

  function cancelServerJob(item) {
    return cancelServerJobId(item.jobId);
  }

  function stopConnections(item) {
    if (item.source) item.source.close();
    if (item.upload) item.upload.abort();
  }

  function removeItem(item) {
    if (item.clipPreviewReplayTimer) {
      clearTimeout(item.clipPreviewReplayTimer);
      item.clipPreviewReplayTimer = null;
    }
    if (isActive(item)) {
      item.status = 'canceled';
      stopConnections(item);
      render();
      void cancelServerJob(item).finally(() => {
        if (groupRunning) runQueue();
      });
      return;
    }

    item.status = 'canceled';
    stopConnections(item);
    const index = items.indexOf(item);
    if (index !== -1) items.splice(index, 1);
    render();
    void cancelServerJob(item);
  }

  function cancelAllDownloads() {
    groupRunning = false;
    inputResolveToken += 1;
    inputResolving = false;
    const cancelRequests = [];
    for (const item of items) {
      if (item.status === 'queued' || isActive(item)) {
        item.status = 'canceled';
        stopConnections(item);
        if (item.jobId) cancelRequests.push(cancelServerJob(item));
      }
    }
    setStatus('canceled');
    render();
    return Promise.all(cancelRequests);
  }

  cancelButton.addEventListener('click', () => {
    void cancelAllDownloads();
  });

  clearButton.addEventListener('click', () => {
    clearConfirming = true;
    updateControls();
    clearConfirmYes.focus();
  });

  clearKeep.addEventListener('click', () => {
    clearConfirming = false;
    updateControls();
    clearButton.focus();
  });

  clearConfirm.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') clearKeep.click();
  });

  clearConfirmYes.addEventListener('click', async () => {
    clearConfirming = false;
    urlInput.focus();
    await cancelAllDownloads();
    items.length = 0;
    setStatus('');
    render();
  });

  addButton.addEventListener('click', () => {
    void queueInput();
  });

  compressButton.addEventListener('click', () => {
    compressFileInput.click();
  });

  compressFileInput.addEventListener('change', () => {
    const files = [...compressFileInput.files];
    compressFileInput.value = '';
    const queued = files.map(queueFile);
    render();
    for (const item of queued) startSingleItem(item);
  });

  clipInputButton.addEventListener('click', () => {
    inputClipOpen = !inputClipOpen;
    if (inputClipOpen) populateInputClipFromUrl();
    updateControls();
    if (inputClipOpen) {
      void loadInputClipMetadata();
      void loadInputClipPreview();
      inputClipStart.focus();
    }
  });

  inputClipStart.addEventListener('input', () => {
    resetClipView(inputClipView);
    inputClipView.focus = 'start';
    setStatus('');
    scheduleInputPreviewReplay();
    updateControls();
  });
  inputClipEnd.addEventListener('input', () => {
    resetClipView(inputClipView);
    inputClipView.focus = 'end';
    setStatus('');
    scheduleInputPreviewReplay();
    updateControls();
  });

  inputClipPreviewButton.addEventListener('click', () => {
    const clip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    if (!clip.ok) {
      setStatus(clip.error, true);
      return;
    }
    inputClipPreviewOpen = !inputClipPreviewOpen;
    inputClipPreviewAutoPlay = inputClipPreviewOpen;
    updateControls();
    if (inputClipPreviewOpen && !inputClipPreviewSource) {
      void loadInputClipPreview();
    }
  });

  inputClipDownloadButton.addEventListener('click', async () => {
    const clip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    if (!clip.ok) {
      setStatus(clip.error, true);
      return;
    }
    const queued = await queueInput();
    for (const item of queued) startSingleItem(item);
  });

  inputClipClear.addEventListener('click', () => {
    inputClipStart.value = '';
    inputClipEnd.value = '';
    inputClipPreviewOpen = false;
    inputClipPreviewAutoPlay = false;
    resetClipView(inputClipView);
    setStatus('');
    updateControls();
    inputClipStart.focus();
  });

  clearTextButton.addEventListener('click', () => {
    urlInput.value = '';
    resetInputClip();
    updateControls();
    urlInput.focus();
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    await queueInput();
    reactivateRetryableItems();
    groupRunning = true;
    runQueue();
  });

  urlInput.addEventListener('keydown', (event) => {
    if (event.key === 'Backspace' && urlInput.value.length > 0) {
      const now = Date.now();
      if (event.repeat || now - lastBackspaceAt < DOUBLE_BACKSPACE_MS) {
        event.preventDefault();
        urlInput.value = '';
        resetInputClip();
        lastBackspaceAt = 0;
        updateControls();
        return;
      }
      lastBackspaceAt = now;
      return;
    }

    if (event.key !== 'Enter') return;
    event.preventDefault();
    void queueInput();
  });

  window.addEventListener('pointerup', endClipDrag);
  window.addEventListener('pointercancel', endClipDrag);

  urlInput.addEventListener('input', () => {
    resetInputMetadataIfUrlChanged();
    populateInputClipFromUrl();
    updateControls();
    const urls = urlInput.value.trim().split(/\s+/).filter(Boolean);
    const singleLink = urls.length === 1 && Boolean(sourceLabel(urls[0]));
    if (!clipInputButton.hidden && (inputClipOpen || singleLink)) scheduleInputClipMetadata();
    if (inputClipOpen) scheduleInputClipPreview();
  });
  render();
</script>
</body>
</html>
