<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Dominator</title>
<link rel="icon" type="image/png" href="/logo.png?v=464aa8a">
<style>
  @font-face {
    font-family: 'Ioskeley Mono';
    src: url('/fonts/IoskeleyMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #000;
    --fg: oklch(0.88 0.035 75);
    --dim: oklch(0.65 0.025 75);
    --line: oklch(0.29 0.018 75);
    --surface: #0c0c0c;
    --muted-surface: #151515;
    --accent: oklch(0.8 0.15 75);
    --error: #ff8585;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Ioskeley Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 17px;
    min-height: 100vh;
  }
  main {
    width: min(680px, calc(100% - 64px));
    position: fixed;
    top: 50svh;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .brand {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(100% + 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .logo {
    width: 88px;
    height: auto;
    opacity: 1;
    mix-blend-mode: screen;
  }
  .input-wrap { position: relative; }
  form {
    display: flex;
    align-items: stretch;
    min-height: 56px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
  }
  form:focus-within {
    border-color: var(--accent);
    box-shadow:
      0 0 8px color-mix(in oklch, var(--accent) 20%, transparent),
      0 0 28px color-mix(in oklch, var(--accent) 9%, transparent),
      inset 0 0 12px color-mix(in oklch, var(--accent) 4%, transparent);
  }
  input {
    flex: 1;
    min-width: 0;
    padding: 0.5rem 0.65rem;
    background: none;
    border: 0;
    color: var(--fg);
    font: inherit;
    outline: none;
  }
  button {
    background: none;
    border: 0;
    color: var(--accent);
    font: inherit;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.7rem;
    cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease, background-color 120ms ease;
  }
  button:focus-visible,
  input:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: -2px;
  }
  form button {
    min-height: 46px;
    padding: 0 14px;
    border-radius: 0;
    white-space: nowrap;
  }
  #add,
  #clipInput { color: var(--fg); }
  #clipInput.active { color: var(--accent); }
  #download {
    width: 64px;
    flex: 0 0 64px;
    border-left: 1px solid var(--line);
  }
  #clearText {
    position: absolute;
    top: 6px;
    right: 100%;
    width: 28px;
    height: 44px;
    color: var(--dim);
    font-size: 20px;
  }
  #download.ready {
    background: var(--accent);
    color: var(--bg);
    box-shadow:
      0 0 8px color-mix(in oklch, var(--accent) 30%, transparent),
      0 0 24px color-mix(in oklch, var(--accent) 14%, transparent);
  }
  button:disabled { color: var(--dim); cursor: not-allowed; }
  .row-controls {
    flex: 0 0 auto;
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 0.28rem;
  }
  .download-one,
  .remove-job {
    flex: 0 0 1.55rem;
    width: 1.55rem;
    height: 1.45rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    color: var(--dim);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1;
    padding: 0;
  }
  .download-one:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .remove-job:not(:disabled):hover { border-color: var(--error); color: var(--error); }
  .remove-job.cancel-active:not(:disabled):hover { border-color: var(--dim); color: var(--fg); }
  .download-one:disabled,
  .remove-job:disabled { border-color: var(--line); color: var(--dim); cursor: default; }
  .clip-toggle {
    flex: 0 0 3.25rem;
    height: 1.45rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    color: var(--dim);
    font-size: 0.62rem;
    line-height: 1;
    padding: 0;
  }
  .clip-toggle.active {
    color: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px color-mix(in oklch, var(--accent) 14%, transparent);
  }
  .clip-toggle:not(:disabled):hover { color: var(--fg); border-color: var(--fg); }
  .clip-toggle:disabled { border-color: var(--line); color: var(--dim); cursor: default; }
  #cancel { color: var(--error); }
  [hidden] { display: none !important; }
  .status {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    right: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--dim);
  }
  .status.error { color: var(--error); }
  .queue {
    position: absolute;
    top: calc(100% + 40px);
    left: 0;
    right: 0;
    max-height: calc(50svh - 100px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .jobs {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .job {
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 12px;
    display: grid;
    gap: 8px;
    background: var(--surface);
  }
  .job.complete {
    padding-block: 4px;
    background: transparent;
    border-color: transparent;
  }
  .job.complete .job-url { color: var(--dim); font-style: italic; opacity: 0.75; }
  .job.complete .row-controls button,
  .job.complete .row-controls button:hover { border-color: transparent; }
  .job-top {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    width: 100%;
  }
  .job-title {
    min-width: 0;
    width: 100%;
    display: flex;
    align-items: flex-start;
    gap: 0.4rem;
  }
  .site-icon {
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    margin-top: 0.15rem;
    color: var(--fg);
    opacity: 0.9;
  }
  .site-icon svg { display: block; width: 100%; height: 100%; }
  .job-url {
    min-width: 0;
    width: 100%;
    color: var(--fg);
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  .clip-panel {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    color: var(--dim);
    font-size: 12px;
  }
  .input-clip-panel {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    right: 0;
    z-index: 2;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    padding: 16px;
  }
  .input-wrap.input-clip-open ~ .status {
    transform: translateY(calc(var(--input-clip-height, 0px) + 0.5rem));
  }
  .input-wrap.input-clip-open ~ .queue {
    top: calc(100% + var(--input-clip-height, 0px) + 56px);
    max-height: max(160px, calc(50svh - var(--input-clip-height, 0px) - 116px));
  }
  .clip-field {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .clip-field > span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .clip-field input {
    flex: 0 0 5.6rem;
    width: 5.6rem;
    border: 1px solid var(--line);
    padding: 0.22rem 0.3rem;
    color: var(--fg);
    font-size: 0.72rem;
  }
  .clip-field input:disabled { color: var(--dim); }
  .clear-clip,
  .preview-clip {
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 0.32rem 0.55rem;
    font-size: 0.62rem;
  }
  .clear-clip:not(:disabled):hover,
  .preview-clip:not(:disabled):hover { color: var(--fg); border-color: var(--fg); }
  .clear-clip:disabled,
  .preview-clip:disabled { color: var(--dim); cursor: default; }
  #inputClipTrack,
  #inputClipPreviewPanel,
  .clip-preview-panel,
  .clip-track-wrap {
    flex: 1 0 100%;
    display: grid;
    gap: 0.2rem;
  }
  .clip-track {
    position: relative;
    height: 4.8rem;
    border: 1px solid var(--line);
    overflow: hidden;
    touch-action: none;
    background: repeating-linear-gradient(90deg, var(--surface) 0 0.55rem, var(--muted-surface) 0.55rem 1.1rem);
  }
  .clip-track.has-thumb,
  .clip-track.has-filmstrip {
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.45)),
      var(--clip-thumb);
    background-position: center, center;
  }
  .clip-track.has-thumb {
    background-repeat: no-repeat, repeat-x;
    background-size: 100% 100%, auto 100%;
  }
  .clip-track.has-filmstrip {
    background-repeat: no-repeat, no-repeat;
    background-size: 100% 100%, 100% 100%;
  }
  .clip-track::before {
    content: '';
    position: absolute;
    inset: 0.35rem 0;
    background: repeating-linear-gradient(90deg, transparent 0 2.2rem, rgba(232, 232, 232, 0.14) 2.2rem 2.25rem);
    pointer-events: none;
  }
  .clip-outside {
    position: absolute;
    top: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.62);
    pointer-events: none;
  }
  .clip-range-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    background: color-mix(in oklch, var(--accent) 15%, transparent);
    border-inline: 1px solid var(--accent);
  }
  .clip-handle {
    position: absolute;
    top: -1px;
    bottom: -1px;
    width: 0.58rem;
    transform: translateX(-50%);
    border-inline: 1px solid #000;
    background: var(--accent);
    cursor: ew-resize;
    padding: 0;
  }
  .clip-track-tools {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .clip-track-zoom {
    display: flex;
    gap: 0.25rem;
  }
  .clip-zoom {
    min-width: 1.6rem;
    padding-inline: 0.35rem;
  }
  .clip-track-note,
  .clip-preview-note {
    color: var(--dim);
    font-size: 0.6rem;
    letter-spacing: 0.06em;
  }
  .clip-preview-player {
    flex: 1 0 100%;
    width: 100%;
    max-height: 260px;
    border: 1px solid var(--line);
    background: #050505;
  }
  .job-state {
    color: var(--dim);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
  }
  .job-state.error { color: var(--error); }
  .bar { height: 2px; background: var(--line); overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .list-actions {
    position: sticky;
    bottom: 0;
    display: flex;
    justify-content: flex-end;
    gap: 16px;
    background: var(--bg);
    padding: 8px 0;
  }
  button:not(:disabled):is(:focus-visible, .active) .control-icon {
    filter: drop-shadow(0 0 4px color-mix(in oklch, var(--accent) 35%, transparent));
  }
  .control-icon { display: block; width: 20px; height: 20px; pointer-events: none; }
  button:has(.control-icon) { display: inline-flex; align-items: center; justify-content: center; }
  form button { min-width: 44px; }
  form::before, form::after {
    content: '';
    position: absolute;
    width: 7px;
    height: 7px;
    border-color: var(--accent);
    border-style: solid;
    pointer-events: none;
  }
  form::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  form::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
  button { text-transform: none; letter-spacing: 0; touch-action: manipulation; }
  input { font-size: 16px; touch-action: manipulation; }
  button:not(:disabled):active { background-color: var(--muted-surface); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row-controls { gap: 6px; }
  .row-controls button { min-width: 32px; height: 30px; border-radius: 0; color: var(--dim); }
  .clip-toggle { flex-basis: 32px; }
  .clear-clip, .preview-clip, .clip-field input { min-height: 34px; border-radius: 0; }
  .clip-track { height: 88px; border-radius: 0; }
  .clip-track-note, .clip-preview-note { font-size: 11px; letter-spacing: 0; line-height: 1.5; }
  .job-state { font-size: 11px; letter-spacing: 0; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .bar { border-radius: 0; }
  .list-actions button { min-height: 36px; padding: 0 8px; }
  @media (hover: hover) and (pointer: fine) {
    form button:not(:disabled):hover { background: var(--muted-surface); }
    button:not(:disabled):hover .control-icon {
      filter: drop-shadow(0 0 4px color-mix(in oklch, var(--accent) 35%, transparent));
    }
    #download.ready:hover { background: color-mix(in oklch, var(--accent) 85%, white); }
  }
  @media (pointer: coarse) {
    .row-controls button, .clear-clip, .preview-clip, .clip-zoom, .list-actions button { min-width: 44px; min-height: 44px; }
    .clip-handle { width: 20px; }
  }
  @media (max-width: 620px) {
    main { width: calc(100% - 48px); top: 42svh; }
    .brand { bottom: calc(100% + 24px); }
    form.has-input { flex-wrap: wrap; }
    form.has-input input { flex-basis: 100%; min-height: 48px; border-bottom: 1px solid var(--line); margin-bottom: 7px; }
    form button { flex: 1; padding-inline: 10px; }
    #download { width: 64px; flex-basis: 64px; }
    .job-top { flex-direction: column; gap: 8px; }
    .row-controls { align-self: flex-end; }
    .job-title { gap: 8px; }
    .input-clip-panel { padding: 12px; }
    .clip-field { flex: 1; }
    .clip-field input { min-width: 0; font-size: 16px; }
    .queue { max-height: calc(58svh - 100px); }
  }
  @media (max-height: 600px) {
    main { position: relative; top: auto; left: auto; transform: none; margin: 160px auto 32px; }
    .queue, .input-wrap.input-clip-open ~ .queue { max-height: none; padding-bottom: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="logo" src="/logo-hd.png" width="1254" height="1254" alt="">
  </header>
  <div class="input-wrap">
    <button id="clearText" type="button" title="clear text" aria-label="clear text" hidden disabled data-icon="close"></button>
    <form id="form">
      <input id="url" type="text" aria-label="media URL" autofocus spellcheck="false">
      <button id="add" type="button" hidden disabled aria-label="add to queue" data-icon="add"></button>
      <button id="clipInput" type="button" hidden disabled aria-label="edit clip" data-icon="clip"></button>
      <button id="download" type="submit" aria-label="download" disabled data-icon="download"></button>
    </form>
    <div id="inputClipPanel" class="clip-panel input-clip-panel" hidden>
      <label class="clip-field">
        <span>start</span>
        <input id="inputClipStart" name="input-clip-start" type="text" aria-label="clip start time">
      </label>
      <label class="clip-field">
        <span>end</span>
        <input id="inputClipEnd" name="input-clip-end" type="text" aria-label="clip end time">
      </label>
      <button id="inputClipClear" class="clear-clip" type="button" disabled aria-label="reset clip" data-icon="reset"></button>
      <button id="inputClipPreview" class="preview-clip" type="button" disabled aria-label="preview clip" data-icon="play"></button>
      <button id="inputClipDownload" class="preview-clip" type="button" disabled aria-label="download clip" data-icon="download"></button>
      <div id="inputClipTrack"></div>
      <div id="inputClipPreviewPanel"></div>
    </div>
  </div>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div class="queue">
    <div id="jobs" class="jobs"></div>
    <div class="list-actions">
      <button id="cancel" type="button" hidden aria-label="cancel downloads" data-icon="stop"></button>
      <button id="clear" type="button" hidden aria-label="clear queue" data-icon="clear"></button>
    </div>
  </div>
</main>
<script>
  const MAX_ACTIVE_JOBS = 7;
  const MAX_CLIP_SECONDS = 24 * 60 * 60;
  const DOUBLE_BACKSPACE_MS = 300;
  const main = document.querySelector('main');
  const form = document.getElementById('form');
  const inputWrap = document.querySelector('.input-wrap');
  const urlInput = document.getElementById('url');
  const addButton = document.getElementById('add');
  const clipInputButton = document.getElementById('clipInput');
  const inputClipPanel = document.getElementById('inputClipPanel');
  const inputClipStart = document.getElementById('inputClipStart');
  const inputClipEnd = document.getElementById('inputClipEnd');
  const inputClipClear = document.getElementById('inputClipClear');
  const inputClipPreviewButton = document.getElementById('inputClipPreview');
  const inputClipDownloadButton = document.getElementById('inputClipDownload');
  const inputClipTrack = document.getElementById('inputClipTrack');
  const inputClipPreviewPanel = document.getElementById('inputClipPreviewPanel');
  const clearTextButton = document.getElementById('clearText');
  const downloadButton = document.getElementById('download');
  const cancelButton = document.getElementById('cancel');
  const clearButton = document.getElementById('clear');
  const jobsList = document.getElementById('jobs');
  const statusLine = document.getElementById('status');

  const CONTROL_ICONS = {
    close: 'M5 5 15 15 M15 5 5 15',
    add: 'M10 4v12 M4 10h12',
    minus: 'M4 10h12',
    download: 'M10 3v9 M6 8l4 4 4-4 M4 13v4h12v-4',
    clip: 'M3 3h4v4H3z M3 13h4v4H3z M7 7l10 10 M7 13 17 3',
    reset: 'M4 8V4 M4 8h4 M4 8l4-4h5l4 4v5l-4 4H7l-3-3',
    play: 'M6 3l10 7-10 7z',
    stop: 'M5 5h10v10H5z',
    clear: 'M3 5h14 M8 5V3h4v2 M5 5v12h10V5 M8 8v6 M12 8v6',
  };

  function setButtonIcon(button, name) {
    if (button.dataset.icon === name && button.firstElementChild) return;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 20 20');
    svg.setAttribute('class', 'control-icon');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.5');
    svg.setAttribute('stroke-linecap', 'square');
    svg.setAttribute('stroke-linejoin', 'miter');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', CONTROL_ICONS[name]);
    svg.append(path);
    button.replaceChildren(svg);
    button.dataset.icon = name;
  }

  document.querySelectorAll('button[data-icon]').forEach((button) => {
    setButtonIcon(button, button.dataset.icon);
  });

  let nextLocalId = 1;
  let groupRunning = false;
  let inputResolving = false;
  let inputResolveToken = 0;
  let inputClipOpen = false;
  let inputClipDuration = null;
  let inputClipThumbnail = null;
  let inputClipFilmstrip = null;
  let inputClipPreviewSource = null;
  let inputClipPreviewOpen = false;
  let inputClipPreviewAutoPlay = false;
  let inputClipZoom = 1;
  let inputClipLoading = false;
  let inputClipPreviewLoading = false;
  let inputClipMetadataUrl = '';
  let inputClipPreviewUrl = '';
  let inputClipMetadataToken = 0;
  let inputClipPreviewToken = 0;
  let inputClipMetadataTimer = null;
  let inputClipPreviewTimer = null;
  let inputClipPreviewReplayTimer = null;
  let lastBackspaceAt = 0;
  let clipDragActive = false;
  let renderQueued = false;
  const items = [];

  const inputClipResizeObserver = new ResizeObserver(() => {
    const height = inputClipPanel.hidden ? 0 : inputClipPanel.getBoundingClientRect().height;
    main.style.setProperty('--input-clip-height', height + 'px');
  });
  inputClipResizeObserver.observe(inputClipPanel);

  function setStatus(text, isError = false) {
    statusLine.textContent = text;
    statusLine.classList.toggle('error', isError);
  }

  function isActive(item) {
    return item.status === 'starting' || item.status === 'downloading' || item.status === 'processing';
  }

  function canEditClip(item) {
    return item.format !== 'audio' && sourceForUrl(item.url) !== 'discord' && (
      item.status === 'queued' || item.status === 'canceled' || item.status === 'invalid'
    );
  }

  function hasClipText(item) {
    return item.clipStart.trim().length > 0 || item.clipEnd.trim().length > 0;
  }

  function hasInputClipText() {
    return inputClipStart.value.trim().length > 0 || inputClipEnd.value.trim().length > 0;
  }

  function resetInputClip() {
    inputClipStart.value = '';
    inputClipEnd.value = '';
    inputClipOpen = false;
    inputClipDuration = null;
    inputClipThumbnail = null;
    inputClipFilmstrip = null;
    inputClipPreviewSource = null;
    inputClipPreviewOpen = false;
    inputClipPreviewAutoPlay = false;
    inputClipZoom = 1;
    inputClipLoading = false;
    inputClipPreviewLoading = false;
    inputClipMetadataUrl = '';
    inputClipPreviewUrl = '';
    inputClipMetadataToken += 1;
    inputClipPreviewToken += 1;
    if (inputClipMetadataTimer) clearTimeout(inputClipMetadataTimer);
    if (inputClipPreviewTimer) clearTimeout(inputClipPreviewTimer);
    if (inputClipPreviewReplayTimer) clearTimeout(inputClipPreviewReplayTimer);
    inputClipMetadataTimer = null;
    inputClipPreviewTimer = null;
    inputClipPreviewReplayTimer = null;
  }

  function updateInputClipControls(hasInput) {
    const showPanel = hasInput && inputClipOpen;
    inputClipPanel.hidden = !showPanel;
    inputWrap.classList.toggle('input-clip-open', showPanel);
    const inputClip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    clipInputButton.classList.toggle('active', hasInputClipText());
    inputClipClear.disabled = !hasInputClipText();

      let seconds;
      if (event.key === 'Home') seconds = handle === 'start' ? 0 : values.start + Math.min(0.1, values.duration / 1000);
      else if (event.key === 'End') seconds = handle === 'start' ? values.end - Math.min(0.1, values.duration / 1000) : values.duration;
      else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') seconds = (handle === 'start' ? values.start : values.end) - step;
      else if (event.key === 'ArrowRight' || event.key === 'ArrowUp') seconds = (handle === 'start' ? values.start : values.end) + step;
      else return;
      event.preventDefault();
      const gap = Math.min(0.1, values.duration / 1000);
      const start = handle === 'start' ? clamp(seconds, 0, values.end - gap) : values.start;
      const end = handle === 'end' ? clamp(seconds, values.start + gap, values.duration) : values.end;
      options.onChange(formatClipTime(start), formatClipTime(end));
      values = { ...values, start, end };
      refresh();
      if (options.onChangeEnd) options.onChangeEnd();
    }

    zoomOut.addEventListener('click', () => setZoom(stepClipZoom(options.getZoom ? options.getZoom() : 1, -1)));
    zoomReset.addEventListener('click', () => setZoom(1));
    zoomIn.addEventListener('click', () => setZoom(stepClipZoom(options.getZoom ? options.getZoom() : 1, 1)));
    track.addEventListener('pointerdown', (event) => {
      const rect = track.getBoundingClientRect();
      const seconds = clamp((event.clientX - rect.left) / rect.width * view.duration + view.start, 0, values.duration);
      const handle = Math.abs(seconds - values.start) <= Math.abs(seconds - values.end) ? 'start' : 'end';
      beginDrag(event, handle);
    });
    startHandle.addEventListener('pointerdown', (event) => beginDrag(event, 'start'));
    endHandle.addEventListener('pointerdown', (event) => beginDrag(event, 'end'));
    startHandle.addEventListener('keydown', (event) => adjustWithKeyboard(event, 'start'));
    endHandle.addEventListener('keydown', (event) => adjustWithKeyboard(event, 'end'));
    track.addEventListener('pointermove', (event) => {
      if (dragging) setFromPointer(event, dragging);
    });
    function finishDrag() {
      if (dragging && options.onChangeEnd) options.onChangeEnd();
      dragging = null;
      endClipDrag();
    }
    track.addEventListener('pointerup', finishDrag);
    track.addEventListener('pointercancel', finishDrag);

    track.append(leftOutside, rightOutside, fill, startHandle, endHandle);
    wrap.append(track, tools);
    parent.append(wrap);
    refresh();
    return refresh;
  }

  function clipPreviewUrl(source) {
    return safeThumbnailUrl(source);
  }

  function clearPreviewPanel(parent) {
    for (const video of parent.querySelectorAll('video')) {
      video.pause();
      video.removeAttribute('src');
      video.load();
    }
    parent.replaceChildren();
  }

  function appendClipPreview(parent, source, clip, loading, autoPlay = false) {
    if (!clip.ok || !clip.clip) {
      const note = document.createElement('p');
      note.className = 'clip-preview-note';
      note.textContent = clip.error || 'set a start and end to preview';
      parent.append(note);
      return false;
    }
    if (loading || !source) {
      const note = document.createElement('p');
      note.className = 'clip-preview-note';
      note.textContent = loading ? 'building preview video' : 'preview video unavailable';
      parent.append(note);
      return false;
    }

    const start = clip.clip.start;
    const end = clip.clip.end;
    const video = document.createElement('video');
    video.className = 'clip-preview-player';
    video.controls = true;
    video.playsInline = true;
    video.preload = 'metadata';
    video.src = clipPreviewUrl(source);
    video.dataset.previewSource = video.src;
    video.dataset.clipStart = String(start);
    video.dataset.clipEnd = String(end);
    let shouldPlay = autoPlay;

    function seekToStart() {
      try {
        if (video.currentTime < start || video.currentTime >= end || Math.abs(video.currentTime - start) > 0.15) {
          video.currentTime = start;
        }
      } catch {}
    }

    function playWhenReady() {
      seekToStart();
      if (video.readyState >= 3 && Math.abs(video.currentTime - start) <= 0.25) {
        shouldPlay = false;
        void video.play().catch(() => {});
      }
    }

    video.addEventListener('loadedmetadata', () => {
      seekToStart();
      if (shouldPlay) playWhenReady();
    });
    video.addEventListener('canplay', () => {
      if (shouldPlay) playWhenReady();
    });
    video.addEventListener('seeked', () => {
      if (shouldPlay) playWhenReady();
    });
    video.addEventListener('play', () => {
      if (video.currentTime < start || video.currentTime >= end) seekToStart();
    });
    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= end) {
        video.pause();
        seekToStart();
      }
    });
    parent.append(video);
    return true;
  }

  function canReuseClipPreview(video, source, clip) {
    return Boolean(
      video &&
      clip.ok &&
      clip.clip &&
      video.dataset.previewSource === clipPreviewUrl(source) &&
      video.dataset.clipStart === String(clip.clip.start) &&
      video.dataset.clipEnd === String(clip.clip.end)
    );
  }

  function replayInputPreview() {
    if (!inputClipPreviewOpen) return;
    inputClipPreviewAutoPlay = true;
    if (!inputClipPreviewSource && !inputClipPreviewLoading) void loadInputClipPreview();
    renderInputClipPreview(true);
  }

  function scheduleInputPreviewReplay() {
    if (!inputClipPreviewOpen) return;
    if (inputClipPreviewReplayTimer) clearTimeout(inputClipPreviewReplayTimer);
    inputClipPreviewReplayTimer = setTimeout(() => {
      inputClipPreviewReplayTimer = null;
      replayInputPreview();
    }, 300);
  }

  function renderInputClipTrack(showPanel) {
    inputClipTrack.replaceChildren();
    if (!showPanel) return;
    appendClipTrack(inputClipTrack, {
      duration: inputClipDuration,
      thumbnail: inputClipThumbnail,
      filmstrip: inputClipFilmstrip,
      loading: inputClipLoading,
      previewLoading: inputClipPreviewLoading,
      disabled: false,
      getStartText: () => inputClipStart.value,
      getEndText: () => inputClipEnd.value,
      getZoom: () => inputClipZoom,
      onZoomChange: (zoom) => {
        inputClipZoom = zoom;
      },
      onChange: (start, end) => {
        inputClipStart.value = start;
        inputClipEnd.value = end;
        setStatus('');
        clipInputButton.classList.add('active');
        inputClipClear.disabled = false;
        inputClipPreviewButton.disabled = false;
        inputClipDownloadButton.disabled = groupRunning || activeCount() >= MAX_ACTIVE_JOBS;
      },
      onChangeEnd: () => {
        replayInputPreview();
      },
    });
  }

  function renderInputClipPreview(showPanel) {
    const clip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    const existingVideo = inputClipPreviewPanel.querySelector('video');
    if (
      showPanel &&
      inputClipPreviewOpen &&
      !inputClipPreviewLoading &&
      !inputClipPreviewAutoPlay &&
      canReuseClipPreview(existingVideo, inputClipPreviewSource, clip)
    ) return;
    clearPreviewPanel(inputClipPreviewPanel);
    if (!showPanel || !inputClipPreviewOpen) return;
    const played = appendClipPreview(
      inputClipPreviewPanel,
      inputClipPreviewSource,
      clip,
      inputClipPreviewLoading,
      inputClipPreviewAutoPlay,
    );
    if (played) inputClipPreviewAutoPlay = false;
  }

  function renderClipPanel(item, reusableVideo = null) {
    const panel = document.createElement('div');
    panel.className = 'clip-panel';
    const previewPanel = document.createElement('div');
    previewPanel.className = 'clip-preview-panel';
    let refreshTrack = () => {};

    function renderRowPreview(autoPlay = false) {
      const clip = clipPayload(item);
      const shouldAutoPlay = autoPlay || item.clipPreviewAutoPlay;
      if (
        item.clipPreviewOpen &&
        !item.previewLoading &&
        !shouldAutoPlay &&
        canReuseClipPreview(reusableVideo, item.previewSource, clip)
      ) {
        previewPanel.append(reusableVideo);
        reusableVideo = null;
        return;
      }
      reusableVideo = null;
      clearPreviewPanel(previewPanel);
      if (!item.clipPreviewOpen) return;
      const played = appendClipPreview(
        previewPanel,
        item.previewSource,
        clip,
        item.previewLoading,
        shouldAutoPlay,
      );
      if (played) item.clipPreviewAutoPlay = false;
    }

    function replayRowPreview() {
      if (!item.clipPreviewOpen) return;
      item.clipPreviewAutoPlay = true;
      if (!item.previewSource && !item.previewLoading) {
        item.previewRequested = true;
        void loadPreview(item);
      }
      renderRowPreview(true);
    }

    function scheduleRowPreviewReplay() {
      if (!item.clipPreviewOpen) return;
      if (item.clipPreviewReplayTimer) clearTimeout(item.clipPreviewReplayTimer);
      item.clipPreviewReplayTimer = setTimeout(() => {
        item.clipPreviewReplayTimer = null;
        replayRowPreview();
      }, 300);
    }

    const startLabel = document.createElement('label');
    startLabel.className = 'clip-field';
    const startText = document.createElement('span');
    startText.textContent = 'start';
    const startInput = document.createElement('input');
    startInput.type = 'text';
    startInput.name = 'clip-start';
    startInput.dataset.clipField = 'start';
    startInput.value = item.clipStart;
    startInput.disabled = !canEditClip(item);
    startInput.setAttribute('aria-label', 'clip start time');
    startInput.addEventListener('input', () => {
      item.clipStart = startInput.value;
      if (clearClipValidation(item)) {
        renderAndRestoreClipFocus(item, 'start', startInput.selectionStart, startInput.selectionEnd);
      } else if (canEditClip(item)) {
        refreshTrack();
        previewClip.disabled = !canPreviewClipNow(item);
        clipDownload.disabled = !canDownloadClipNow(item);
        scheduleRowPreviewReplay();
        updateControls();
      }
    });
    startLabel.append(startText, startInput);

    const endLabel = document.createElement('label');
    endLabel.className = 'clip-field';
    const endText = document.createElement('span');
    endText.textContent = 'end';
    const endInput = document.createElement('input');
    endInput.type = 'text';
    endInput.name = 'clip-end';
    endInput.dataset.clipField = 'end';
    endInput.value = item.clipEnd;
    endInput.disabled = !canEditClip(item);
    endInput.setAttribute('aria-label', 'clip end time');
    endInput.addEventListener('input', () => {
      item.clipEnd = endInput.value;
      if (clearClipValidation(item)) {
        renderAndRestoreClipFocus(item, 'end', endInput.selectionStart, endInput.selectionEnd);
      } else if (canEditClip(item)) {
        refreshTrack();
        previewClip.disabled = !canPreviewClipNow(item);
        clipDownload.disabled = !canDownloadClipNow(item);
        scheduleRowPreviewReplay();
        updateControls();
      }
    });
    endLabel.append(endText, endInput);

    const clearClip = document.createElement('button');
    clearClip.type = 'button';
    clearClip.className = 'clear-clip';
    setButtonIcon(clearClip, 'reset');
    clearClip.setAttribute('aria-label', 'reset clip');
    clearClip.title = 'reset clip';
    clearClip.disabled = !canEditClip(item) || !hasClipText(item);
    clearClip.addEventListener('click', () => {
      item.clipStart = '';
      item.clipEnd = '';
      item.clipPreviewOpen = false;
      item.clipPreviewAutoPlay = false;
      if (item.clipPreviewReplayTimer) clearTimeout(item.clipPreviewReplayTimer);
      item.clipPreviewReplayTimer = null;
      item.clipZoom = 1;
      clearClipValidation(item);
      render();
    });

    const previewClip = document.createElement('button');
    previewClip.type = 'button';
    previewClip.className = 'preview-clip';
    setButtonIcon(previewClip, item.clipPreviewOpen ? 'close' : 'play');
    previewClip.setAttribute('aria-label', item.clipPreviewOpen ? 'hide preview' : 'preview clip');
    previewClip.title = 'preview this clip';
    previewClip.disabled = !canPreviewClipNow(item);
    previewClip.addEventListener('click', () => {
      const clip = clipPayload(item);
      if (!clip.ok) {
        item.status = 'invalid';
        item.error = clip.error;
        setStatus(clip.error, true);
        render();
        return;
      }
      item.clipPreviewOpen = !item.clipPreviewOpen;
      item.clipPreviewAutoPlay = item.clipPreviewOpen;
      if (item.clipPreviewOpen && !item.previewSource) {
        item.previewRequested = true;
        void loadPreview(item);
      }
      render();
    });

    const clipDownload = document.createElement('button');
    clipDownload.type = 'button';
    clipDownload.className = 'preview-clip';
    setButtonIcon(clipDownload, 'download');
    clipDownload.setAttribute('aria-label', 'download clip');
    clipDownload.title = 'download this clip';
    clipDownload.disabled = !canDownloadClipNow(item);
    clipDownload.addEventListener('click', () => {
      const clip = clipPayload(item);
      if (!clip.ok) {
        item.status = 'invalid';
        item.error = clip.error;
        setStatus(clip.error, true);
        render();
        return;
      }
      if (item.status === 'canceled' || item.status === 'invalid') resetForQueue(item);
      startSingleItem(item);
    });

    panel.append(startLabel, endLabel, clearClip, previewClip, clipDownload);
    refreshTrack = appendClipTrack(panel, {
      duration: item.duration,
      thumbnail: item.thumbnail,
      filmstrip: item.filmstrip,
      loading: item.titleLoading,
      previewLoading: item.previewLoading,
      disabled: !canEditClip(item),
      getStartText: () => item.clipStart,
      getEndText: () => item.clipEnd,
      getZoom: () => item.clipZoom,
      onZoomChange: (zoom) => {
        item.clipZoom = zoom;
      },
      onChange: (start, end) => {
        item.clipStart = start;
        item.clipEnd = end;
        startInput.value = start;
        endInput.value = end;
        clearClipValidation(item);
        previewClip.disabled = !canPreviewClipNow(item);
        clipDownload.disabled = !canDownloadClipNow(item);
        updateControls();
      },
      onChangeEnd: () => {
        replayRowPreview();
      },
    });
    renderRowPreview();
    if (item.clipPreviewOpen) panel.append(previewPanel);
    if (canEditClip(item) && !item.filmstrip && !item.previewRequested) {
      item.previewRequested = true;
      window.setTimeout(() => loadPreview(item), 0);
    }
    return panel;
  }

  function renderAndRestoreClipFocus(item, field, selectionStart, selectionEnd) {
    render();
    const input = jobsList.querySelector(
      '[data-local-id="' + item.localId + '"] [data-clip-field="' + field + '"]',
    );
    if (!input) return;
    input.focus();
    if (selectionStart !== null && selectionEnd !== null) {
      input.setSelectionRange(selectionStart, selectionEnd);
    }
  }

  function render() {
    if (clipDragActive) {
      renderQueued = true;
      return;
    }
    renderQueued = false;
    const reusableVideos = new Map();
    for (const row of jobsList.querySelectorAll('.job[data-local-id]')) {
      const video = row.querySelector('.clip-preview-player');
      if (video) reusableVideos.set(row.dataset.localId, video);
    }
    const active = activeCount();
    const nodes = items.map((item) => {
      const row = document.createElement('section');
      row.className = 'job';
      row.dataset.localId = String(item.localId);
      row.classList.toggle('complete', item.status === 'complete');

      const top = document.createElement('div');
      top.className = 'job-top';

      const title = document.createElement('div');
      title.className = 'job-title';

      const source = sourceForUrl(item.url);
      const icon = document.createElement('span');
      icon.className = 'site-icon';
      icon.setAttribute('role', 'img');
      icon.title = sourceName(source);
      icon.setAttribute('aria-label', sourceName(source));
      icon.append(iconForSource(source));

      const url = document.createElement('p');
      url.className = 'job-url';
      url.title = item.url;
      url.textContent = displayTitle(item);

      title.append(icon, url);

      const controls = document.createElement('div');
      controls.className = 'row-controls';

      const clipToggle = document.createElement('button');
      clipToggle.type = 'button';
      clipToggle.className = 'clip-toggle';
      clipToggle.classList.toggle('active', hasClipText(item));
      setButtonIcon(clipToggle, 'clip');
      clipToggle.title = hasClipText(item) ? 'edit clip' : 'set clip';
      clipToggle.disabled = !canEditClip(item);
      clipToggle.setAttribute('aria-label', hasClipText(item) ? 'edit clip' : 'set clip');
      clipToggle.addEventListener('click', () => {
        item.clipOpen = !item.clipOpen;
        render();
      });

      const downloadOne = document.createElement('button');
      downloadOne.type = 'button';
      downloadOne.className = 'download-one';
      setButtonIcon(downloadOne, 'download');
      downloadOne.title = singleDownloadTitle(active);
      downloadOne.disabled = !canStartSingleDownload(item, active);
      downloadOne.setAttribute('aria-label', item.format !== 'mp4' ? 'download this track' : 'download this video');
      downloadOne.addEventListener('click', () => startSingleItem(item));

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove-job';
      remove.classList.toggle('cancel-active', isActive(item));
      setButtonIcon(remove, 'close');
      remove.title = isActive(item) ? 'cancel this download' : 'remove';
      remove.setAttribute('aria-label', isActive(item) ? 'cancel this download' : 'remove queued item');
      remove.addEventListener('click', () => removeItem(item));

      if (item.format !== 'audio' && sourceForUrl(item.url) !== 'discord') controls.append(clipToggle);
      controls.append(downloadOne, remove);
      top.append(title, controls);

      row.append(top);

      if (canEditClip(item) && item.clipOpen) {
        row.append(renderClipPanel(item, reusableVideos.get(String(item.localId)) || null));
      }

      if (item.status !== 'queued' && item.status !== 'complete') {
        const state = document.createElement('p');
        state.className = 'job-state';
        state.classList.toggle('error', item.status === 'failed' || item.status === 'invalid');
        state.textContent = statusText(item);

        if (item.status === 'invalid') {
          row.append(state);
        } else {
          const bar = document.createElement('div');
          bar.className = 'bar';
          const fill = document.createElement('div');
          fill.style.width = progressWidth(item);
          bar.append(fill);
          row.append(bar, state);
        }
      }

      return row;
    });
    jobsList.replaceChildren(...nodes);
    updateControls();
  }

  function queueItem(
    url,
    selectedFormat = 'mp4',
    initialTitle = null,
    clipStart = '',
    clipEnd = '',
    playlist = null,
    renderNow = true,
  ) {
    const audioOnly = selectedFormat === 'audio' || sourceForUrl(url) === 'discord';
    const linkedClip = audioOnly ? null : clipRangeFromUrl(url);
    const start = audioOnly
      ? ''
      : clipStart || (linkedClip?.start !== null && linkedClip?.start !== undefined ? formatClipTime(linkedClip.start) : '');
    const end = audioOnly
      ? ''
      : clipEnd || (linkedClip?.end !== null && linkedClip?.end !== undefined ? formatClipTime(linkedClip.end) : '');
    const item = {
      localId: nextLocalId,
      url,
      title: initialTitle,
      titleLoading: !initialTitle && selectedFormat !== 'audio',
      duration: null,
      thumbnail: null,
      filmstrip: null,
      previewSource: null,
      previewLoading: false,
      previewRequested: false,
      clipPreviewOpen: false,
      clipPreviewAutoPlay: false,
      clipPreviewReplayTimer: null,
      clipZoom: 1,
      format: selectedFormat,
      playlist,
      status: 'queued',
      clipStart: start,
      clipEnd: end,
      clipOpen: Boolean(start || end),
      percent: null,
      downloadedBytes: null,
      totalBytes: null,
      error: null,
      jobId: null,
      source: null,
      metadataPromise: null,
    };
    nextLocalId += 1;
    items.push(item);
    if (!initialTitle && selectedFormat !== 'audio') item.metadataPromise = loadTitle(item);
    if (renderNow) render();
    return item;
  }

  async function loadTitle(item) {
    try {
      const response = await fetch('/api/metadata', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url: item.url }),
      });
      let data = {};
      try {
        data = await response.json();
      } catch {}
      if (!items.includes(item)) return;
      if (response.ok && data.title) item.title = data.title;
      if (response.ok) {
        item.duration = clipDurationFromMetadata(data);
        item.thumbnail = safeThumbnailUrl(data.thumbnail) || null;
        if (item.format !== 'audio' && sourceForUrl(item.url) !== 'discord') {
          if (data.clip && !hasClipText(item)) {
            item.clipStart = formatClipTime(data.clip.start);
            item.clipEnd = formatClipTime(data.clip.end);
            item.clipOpen = true;
          } else if (hasClipText(item)) {
            const completed = completeClipText(item.clipStart, item.clipEnd, item.duration);
            item.clipStart = completed.start;
            item.clipEnd = completed.end;
          }
        }
      }
    } catch {
    } finally {
      if (items.includes(item)) {
        item.titleLoading = false;
        render();
      }
    }
  }

  async function pollPreview(previewId, isCurrent) {
    for (let attempt = 0; attempt < 90; attempt += 1) {
      if (!isCurrent()) return null;
      const response = await fetch('/api/previews/' + previewId);
      let data = {};
      try {
        data = await response.json();
      } catch {}
      if (!response.ok) throw new Error(data.error || 'preview failed');
      if (data.status === 'done' && data.spriteUrl) return data;
      if (data.status === 'error') throw new Error(data.error || 'preview failed');
      await new Promise((resolve) => window.setTimeout(resolve, 1500));
    }
    throw new Error('preview timed out');
  }

  async function startPreview(url, isCurrent) {
    const response = await fetch('/api/previews', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    let data = {};
    try {
      data = await response.json();
    } catch {}
    if (!response.ok) {
      const error = new Error(data.error || 'preview failed');
      error.status = response.status;
      throw error;
    }
    if (data.status === 'done' && data.spriteUrl) return data;
    if (!data.previewId) throw new Error('preview failed');
    return pollPreview(data.previewId, isCurrent);
  }

  async function loadPreview(item) {
    if (!items.includes(item) || (item.filmstrip && item.previewSource) || item.previewLoading) return;
    item.previewLoading = true;
    render();
    try {
      const preview = await startPreview(item.url, () => items.includes(item));
      if (!items.includes(item) || !preview) return;
      item.filmstrip = safeThumbnailUrl(preview.spriteUrl) || null;
      item.previewSource = safeThumbnailUrl(preview.sourceUrl) || null;
      if (typeof preview.duration === 'number' && Number.isFinite(preview.duration)) {
        item.duration = Math.max(item.duration || 0, preview.duration);
      }
    } catch (error) {
      if (error.status === 429 && items.includes(item)) {
        window.setTimeout(() => {
          if (!items.includes(item) || item.filmstrip || !canEditClip(item)) return;
          item.previewRequested = false;
          render();
        }, 1500);
      }
    } finally {
      if (items.includes(item)) {
        item.previewLoading = false;
        render();
      }
    }
  }

  function scheduleInputClipMetadata() {
    if (inputClipMetadataTimer) clearTimeout(inputClipMetadataTimer);
    inputClipMetadataTimer = setTimeout(() => {
      inputClipMetadataTimer = null;
      void loadInputClipMetadata();
    }, 500);
  }

  function scheduleInputClipPreview() {
    if (inputClipPreviewTimer) clearTimeout(inputClipPreviewTimer);
    inputClipPreviewTimer = setTimeout(() => {
      inputClipPreviewTimer = null;
      void loadInputClipPreview();
    }, 800);
  }

  async function loadInputClipPreview() {
    const url = firstInputUrl();
    if (!url || inputClipPreviewLoading || (inputClipFilmstrip && inputClipPreviewSource)) return;
    if (url === inputClipPreviewUrl && inputClipFilmstrip && inputClipPreviewSource) return;
    const token = inputClipPreviewToken + 1;
    inputClipPreviewToken = token;
    inputClipPreviewUrl = url;
    inputClipFilmstrip = null;
    inputClipPreviewSource = null;
    inputClipPreviewLoading = true;
    updateInputClipControls(urlInput.value.trim().length > 0);

    try {
      const preview = await startPreview(url, () => token === inputClipPreviewToken);
      if (token !== inputClipPreviewToken || !preview) return;
      inputClipFilmstrip = safeThumbnailUrl(preview.spriteUrl) || null;
      inputClipPreviewSource = safeThumbnailUrl(preview.sourceUrl) || null;
      if (typeof preview.duration === 'number' && Number.isFinite(preview.duration)) {
        inputClipDuration = Math.max(inputClipDuration || 0, preview.duration);
      }
    } catch {
    } finally {
      if (token === inputClipPreviewToken) {
        inputClipPreviewLoading = false;
        updateControls();
      }
    }
  }

  async function loadInputClipMetadata() {
    const url = firstInputUrl();
    if (!url || inputClipLoading) return;
    if (url === inputClipMetadataUrl && (inputClipDuration !== null || inputClipThumbnail)) return;
    const token = inputClipMetadataToken + 1;
    inputClipMetadataToken = token;
    inputClipMetadataUrl = url;
    inputClipDuration = null;
    inputClipThumbnail = null;
    inputClipLoading = true;
    updateInputClipControls(urlInput.value.trim().length > 0);

    try {
      const response = await fetch('/api/metadata', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ url }),
      });
      let data = {};
      try {
        data = await response.json();
      } catch {}
      if (token !== inputClipMetadataToken || !response.ok) return;
      inputClipDuration = clipDurationFromMetadata(data);
      inputClipThumbnail = safeThumbnailUrl(data.thumbnail) || null;
      if (data.clip && !hasInputClipText()) {
        inputClipStart.value = formatClipTime(data.clip.start);
        inputClipEnd.value = formatClipTime(data.clip.end);
        inputClipOpen = true;
      } else if (hasInputClipText()) {
        const completed = completeClipText(
          inputClipStart.value,
          inputClipEnd.value,
          inputClipDuration,
        );
        inputClipStart.value = completed.start;
        inputClipEnd.value = completed.end;
      }
    } catch {
    } finally {
      if (token === inputClipMetadataToken) {
        inputClipLoading = false;
        updateControls();
      }
    }
  }

  function resetInputMetadataIfUrlChanged() {
    const url = firstInputUrl();
    if (url === inputClipMetadataUrl) return;
    inputClipDuration = null;
    inputClipThumbnail = null;
    inputClipFilmstrip = null;
    inputClipPreviewSource = null;
    inputClipPreviewOpen = false;
    inputClipPreviewAutoPlay = false;
    inputClipZoom = 1;
    inputClipMetadataUrl = '';
    inputClipPreviewUrl = '';
    inputClipLoading = false;
    inputClipPreviewLoading = false;
    inputClipMetadataToken += 1;
    inputClipPreviewToken += 1;
    if (inputClipMetadataTimer) clearTimeout(inputClipMetadataTimer);
    if (inputClipPreviewTimer) clearTimeout(inputClipPreviewTimer);
    if (inputClipPreviewReplayTimer) clearTimeout(inputClipPreviewReplayTimer);
    inputClipMetadataTimer = null;
    inputClipPreviewTimer = null;
    inputClipPreviewReplayTimer = null;
  }

  async function queueInput() {
    if (inputResolving) return [];
    const urls = urlInput.value.trim().split(/\s+/).filter(Boolean);
    if (urls.length === 0) return [];
    const clipStart = inputClipStart.value.trim();
    const clipEnd = inputClipEnd.value.trim();
    const queued = [];
    const failedUrls = [];
    const resolveToken = inputResolveToken + 1;
    inputResolveToken = resolveToken;
    let lastError = null;

    urlInput.value = '';
    resetInputClip();
    inputResolving = urls.some((url) => sourceForUrl(url) === 'soundcloud');
    if (inputResolving) setStatus('loading SoundCloud tracks');
    render();

    try {
      for (const url of urls) {
        if (sourceForUrl(url) !== 'soundcloud') {
          const format = sourceForUrl(url) === 'discord' ? 'mp3' : 'mp4';
          queued.push(queueItem(url, format, null, clipStart, clipEnd, null, false));
          continue;
        }

        try {
          const response = await fetch('/api/soundcloud', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          let data = {};
          try {
            data = await response.json();
          } catch {}
          if (resolveToken !== inputResolveToken) return queued;
          if (!response.ok) throw new Error(data.error || 'could not load SoundCloud tracks');
          if (!Array.isArray(data.tracks) || data.tracks.length === 0) {
            throw new Error('SoundCloud returned no tracks');
          }

          const count = data.tracks.length;
          data.tracks.forEach((track, index) => {
            if (!track || typeof track.url !== 'string') return;
            const playlist = count > 1 ? { index: index + 1, count } : null;
            queued.push(queueItem(
              track.url,
              'audio',
              typeof track.title === 'string' ? track.title : null,
              '',
              '',
              playlist,
              false,
            ));
          });
        } catch (error) {
          failedUrls.push(url);
          lastError = error instanceof Error && error.message
            ? error.message
            : 'could not load SoundCloud tracks';
        }
      }
    } finally {
      if (resolveToken === inputResolveToken) {
        inputResolving = false;
        if (failedUrls.length > 0) {
          const currentInput = urlInput.value.trim();
          urlInput.value = [...failedUrls, currentInput].filter(Boolean).join(' ');
        }
        setStatus(lastError || '', Boolean(lastError));
        render();
      }
    }
    return queued;
  }

  function downloadFile(item) {
    if (!item.jobId) return;
    const link = document.createElement('a');
    link.href = '/api/jobs/' + item.jobId + '/file';
    link.download = '';
    document.body.append(link);
    link.click();
    link.remove();
  }

  function finishItem(item, status, message = null) {
    if (item.source) item.source.close();
    item.source = null;
    item.status = status;
    item.error = message;

    if (groupRunning) {
      runQueue();
    } else {
      render();
    }
  }

  async function startItem(item) {
    if (item.status !== 'queued') return;

    item.status = 'starting';
    item.error = null;
    render();

    if (item.titleLoading && hasClipText(item) && item.metadataPromise) {
      await item.metadataPromise;
      if (item.status !== 'starting') return;
    }

    const clip = clipPayload(item);
    if (!clip.ok) {
      item.status = 'invalid';
      item.error = clip.error;
      setStatus(clip.error, true);
      if (groupRunning) runQueue();
      else render();
      return;
    }

    setStatus('');
    const body = { url: item.url, format: item.format };
    if (clip.clip) body.clip = clip.clip;
    if (item.playlist) body.playlist = item.playlist;

    let data;
    try {
      const response = await fetch('/api/jobs', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      try {
        data = await response.json();
      } catch {
        data = {};
      }
      if (!response.ok) {
        finishItem(item, 'failed', data.error || 'could not start download');
        return;
      }
    } catch {
      finishItem(item, 'failed', 'could not reach server');
      return;
    }

    item.jobId = data.jobId;
    if (item.status === 'canceled') {
      await cancelServerJob(item);
      render();
      if (groupRunning) runQueue();
      return;
    }

    const source = new EventSource('/api/jobs/' + item.jobId + '/events');
    item.source = source;

    source.addEventListener('progress', (event) => {
      let progress;
      try {
        progress = JSON.parse(event.data);
      } catch {
        return;
      }
      if (progress.stage === 'downloading') {
        item.status = 'downloading';
        item.percent = progress.percent;
        item.downloadedBytes = progress.downloadedBytes;
        item.totalBytes = progress.totalBytes;
      } else {
        item.status = 'processing';
      }
      render();
    });

    source.addEventListener('done', () => {
      source.close();
      item.source = null;
      item.status = 'saving';
      render();
      downloadFile(item);
      window.setTimeout(() => finishItem(item, 'complete'), 700);
    });

    source.addEventListener('failed', (event) => {
      finishItem(item, 'failed', event.data || 'failed');
    });

    source.addEventListener('canceled', () => {
      finishItem(item, 'canceled');
    });

    source.onerror = () => {
      if (isActive(item)) finishItem(item, 'failed', 'lost connection to server');
    };
  }

  function resetForQueue(item) {
    item.status = 'queued';
    item.percent = null;
    item.downloadedBytes = null;
    item.totalBytes = null;
    item.error = null;
    item.jobId = null;
    item.source = null;
  }

  function reactivateCanceledItems() {
    for (const item of items) {
      if (item.status === 'canceled') resetForQueue(item);
    }
  }

  function startSingleItem(item) {
    if (groupRunning || activeCount() >= MAX_ACTIVE_JOBS) return;
    if (item.status === 'canceled') resetForQueue(item);
    if (item.status !== 'queued') return;
    groupRunning = false;
    void startItem(item);
  }

  function runQueue() {
    while (activeCount() < MAX_ACTIVE_JOBS) {
      const item = items.find((candidate) => candidate.status === 'queued');
      if (!item) break;
      void startItem(item);
    }
    if (queuedCount() === 0 && activeCount() === 0) {
      groupRunning = false;
    }
    render();
  }

  async function cancelServerJob(item) {
    if (!item.jobId) return;
    try {
      await fetch('/api/jobs/' + item.jobId, { method: 'DELETE' });
    } catch {}
  }

  function removeItem(item) {
    if (item.clipPreviewReplayTimer) {
      clearTimeout(item.clipPreviewReplayTimer);
      item.clipPreviewReplayTimer = null;
    }
    if (isActive(item)) {
      item.status = 'canceled';
      if (item.source) item.source.close();
      render();
      void cancelServerJob(item).finally(() => {
        if (groupRunning) runQueue();
      });
      return;
    }

    item.status = 'canceled';
    if (item.source) item.source.close();
    const index = items.indexOf(item);
    if (index !== -1) items.splice(index, 1);
    render();
    void cancelServerJob(item);
  }

  function cancelAllDownloads() {
    groupRunning = false;
    inputResolveToken += 1;
    inputResolving = false;
    const cancelRequests = [];
    for (const item of items) {
      if (item.status === 'queued' || isActive(item)) {
        item.status = 'canceled';
        if (item.source) item.source.close();
        if (item.jobId) cancelRequests.push(cancelServerJob(item));
      }
    }
    setStatus('canceled');
    render();
    return Promise.all(cancelRequests);
  }

  cancelButton.addEventListener('click', () => {
    void cancelAllDownloads();
  });

  clearButton.addEventListener('click', async () => {
    await cancelAllDownloads();
    items.length = 0;
    setStatus('');
    render();
  });

  addButton.addEventListener('click', () => {
    void queueInput();
  });

  clipInputButton.addEventListener('click', () => {
    inputClipOpen = !inputClipOpen;
    if (inputClipOpen) populateInputClipFromUrl();
    updateControls();
    if (inputClipOpen) {
      void loadInputClipMetadata();
      void loadInputClipPreview();
      inputClipStart.focus();
    }
  });

  inputClipStart.addEventListener('input', () => {
    setStatus('');
    scheduleInputPreviewReplay();
    updateControls();
  });
  inputClipEnd.addEventListener('input', () => {
    setStatus('');
    scheduleInputPreviewReplay();
    updateControls();
  });

  inputClipPreviewButton.addEventListener('click', () => {
    const clip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    if (!clip.ok) {
      setStatus(clip.error, true);
      return;
    }
    inputClipPreviewOpen = !inputClipPreviewOpen;
    inputClipPreviewAutoPlay = inputClipPreviewOpen;
    updateControls();
    if (inputClipPreviewOpen && !inputClipPreviewSource) {
      void loadInputClipPreview();
    }
  });

  inputClipDownloadButton.addEventListener('click', async () => {
    const clip = clipPayload({
      clipStart: inputClipStart.value,
      clipEnd: inputClipEnd.value,
      duration: inputClipDuration,
    });
    if (!clip.ok) {
      setStatus(clip.error, true);
      return;
    }
    const queued = await queueInput();
    for (const item of queued) startSingleItem(item);
  });

  inputClipClear.addEventListener('click', () => {
    inputClipStart.value = '';
    inputClipEnd.value = '';
    inputClipPreviewOpen = false;
    inputClipPreviewAutoPlay = false;
    inputClipZoom = 1;
    setStatus('');
    updateControls();
    inputClipStart.focus();
  });

  clearTextButton.addEventListener('click', () => {
    urlInput.value = '';
    resetInputClip();
    updateControls();
    urlInput.focus();
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    await queueInput();
    reactivateCanceledItems();
    groupRunning = true;
    runQueue();
  });

  urlInput.addEventListener('keydown', (event) => {
    if (event.key === 'Backspace' && urlInput.value.length > 0) {
      const now = Date.now();
      if (event.repeat || now - lastBackspaceAt < DOUBLE_BACKSPACE_MS) {
        event.preventDefault();
        urlInput.value = '';
        resetInputClip();
        lastBackspaceAt = 0;
        updateControls();
        return;
      }
      lastBackspaceAt = now;
      return;
    }

    if (event.key !== 'Enter') return;
    event.preventDefault();
    void queueInput();
  });

  window.addEventListener('pointerup', endClipDrag);
  window.addEventListener('pointercancel', endClipDrag);

  urlInput.addEventListener('input', () => {
    resetInputMetadataIfUrlChanged();
    populateInputClipFromUrl();
    updateControls();
    if (inputClipOpen) {
      scheduleInputClipMetadata();
      scheduleInputClipPreview();
    }
  });
  render();
</script>
</body>
</html>
